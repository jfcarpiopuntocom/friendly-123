name: Stock Semaphore

on:
  pull_request:
    paths:
      - "chatgpt-app/stock-semaphore/**"
      - "chatgpt-plugin/stock-semaphore/**"
      - ".github/workflows/stock-semaphore-test.yml"
  push:
    branches: [master]
    paths:
      - "chatgpt-app/stock-semaphore/**"
      - "chatgpt-plugin/stock-semaphore/**"
      - ".github/workflows/stock-semaphore-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Stock Semaphore tests
        run: node chatgpt-app/stock-semaphore/test.mjs
      - name: Validate plugin JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('chatgpt-plugin/stock-semaphore/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('chatgpt-plugin/stock-semaphore/mcp.json','utf8'))"
