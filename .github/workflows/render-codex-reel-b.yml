name: Render corrected Codex Reel B
on:
  push:
    branches: [codex/reels-comparacion]
  workflow_dispatch:
jobs:
  render-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v google-chrome
      - name: Render corrected B
        working-directory: video/codex-reel-B
        run: |
          npm ci
          node music/score.mjs
          ffmpeg -y -i music/score.wav -af "highpass=f=30,equalizer=f=250:t=q:w=1:g=-2,loudnorm=I=-14:TP=-1.2:LRA=8" -c:a aac -b:a 192k assets/score.m4a
          node render.mjs --frames --workers=1 --soft-gl --chrome=/usr/bin/google-chrome
          node render.mjs --encode --audio=assets/score.m4a --out=out/full.mp4 --fps=30
          ffmpeg -y -i out/full.mp4 -vf "scale='min(1280,iw)':-2" -c:v libx264 -crf 24 -preset medium -c:a aac -b:a 128k codex-reel-B.mp4
          sha256sum codex-reel-B.mp4 > SHA256-B.txt
          ffmpeg -y -i codex-reel-B.mp4 -vf "fps=1/3,scale=640:-1,tile=3x3" -frames:v 1 qc-B-corrected.jpg
      - name: Upload corrected B
        uses: actions/upload-artifact@v4
        with:
          name: codex-reel-B-corrected
          path: |
            video/codex-reel-B/codex-reel-B.mp4
            video/codex-reel-B/SHA256-B.txt
            video/codex-reel-B/qc-B-corrected.jpg
          if-no-files-found: error
