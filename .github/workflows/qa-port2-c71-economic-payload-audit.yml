name: PORT2 C71 cryptographic economic effect vs canonical payload readback (SQLite + Workerd QA)
on:
  pull_request:
    paths:
      - 'cloudflare-yparty-worker/src/authoritative-business-sql.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c71-economic-payload-cryptographic-audit.test.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c68-economic-reopen-certified-effects.test.mjs'
      - '.github/workflows/qa-port2-c71-economic-payload-audit.yml'
  push:
    branches:
      - 'port2/20261120-c71-economic-payload-cryptographic-audit'
permissions:
  contents: read
jobs:
  cryptographic-economic-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix cloudflare-yparty-worker --no-audit --no-fund
      - name: C71 cryptographic payload/receipt readback + C68 regression
        run: |
          node --test cloudflare-yparty-worker/qa/p0-c71-economic-payload-cryptographic-audit.test.mjs
          node --test cloudflare-yparty-worker/qa/p0-c68-economic-reopen-certified-effects.test.mjs
      - name: Existing Workerd economic SQL regressions
        run: |
          node --test cloudflare-yparty-worker/qa/p0-gate-a-typed-payment-sql.test.mjs
          node --test cloudflare-yparty-worker/qa/p0-gate-a-business-sql-workerd.test.mjs
      - name: Original fixed 100.0 score and GO untouched
        run: |
          node scripts/architecture-2-port-score.cjs --json
          node --test test/p0-architecture-2-port-score.test.cjs
