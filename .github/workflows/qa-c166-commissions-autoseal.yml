name: C166 commission total-first build and sealed release
on:
  push:
    branches: [fix/c166-commissions-total-first-20261121]
    paths:
      - .github/workflows/qa-c166-commissions-autoseal.yml
      - src/app/app-inline-01.js
      - src/dashboard/dashboard-main.js
      - docs/core/commission-history.js
      - docs/version.json
      - docs/dashboard.html
      - test/p0-c166-commissions-total-first.test.cjs
permissions:
  contents: write
jobs:
  qa-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c166-commissions-total-first-20261121
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source-executed total-first, real sales and adjacent commission regression
        run: |
          node --test test/p0-c166-commissions-total-first.test.cjs test/p0-belen-commissions-all-dates.test.cjs test/p0-c149-commission-split-order-identity.test.cjs test/p0-c151-single-payee-commission.test.cjs
      - name: Build BOTH published interfaces and exact release SHA manifest
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Commit generated assets only to isolated candidate branch
        run: |
          set -euo pipefail
          git config user.name 'friendly-123 release seal'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(C166): seal v863 app and dashboard commissions total-first'
            git push origin HEAD:refs/heads/fix/c166-commissions-total-first-20261121
          fi
