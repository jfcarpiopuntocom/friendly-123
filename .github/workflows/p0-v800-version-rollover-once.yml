name: P0 v800 version arithmetic rollover official correction
on:
  push:
    branches: [integrate/p0-belen-photo-pointer-strict-ack-v800-20261118]
    paths: [.github/workflows/p0-v800-version-rollover-once.yml]
permissions: {contents: write}
jobs:
  rollover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 'Repair shell 800 display version arithmetic without source changes'
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),get=p=>fs.readFileSync(p,'utf8'),put=(p,s)=>fs.writeFileSync(p,s);
          const v=JSON.parse(get('docs/version.json'));
          if(v.version!=='v0.7.100'||v.releaseName!=='v0.7.100'||v.shell!=='f123-shell-v800'||v.cacheGeneration!=='golden336')throw Error('Unexpected v800 source for rollover');
          v.version='v0.8.00';v.releaseName='v0.8.00';
          put('docs/version.json',JSON.stringify(v,null,2)+'\n');
          let dash=get('docs/dashboard.html');
          for(const [a,b] of [['name="dashboard-release" content="v0.7.100"','name="dashboard-release" content="v0.8.00"'],['Dashboard v0.7.100','Dashboard v0.8.00']]){
            if(dash.split(a).length!==2)throw Error('Unexpected original dashboard identity');
            dash=dash.replace(a,b);
          }
          put('docs/dashboard.html',dash);
          NODE
          node scripts/gen-manifest.js
          bash check-sw.sh
          node --test test/dashboard-identidad-version.test.js test/pwa-icons-multicolor-v577.test.js test/p0-belen-photo-recovery-pointer-strict-ack.test.cjs test/p0-belen-photo-pointer-ack-real-source.test.cjs
          node scripts/release-control.cjs validate 1c9b476cb5ad371e7e84012a6b5a8bb5984377a4
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/version.json docs/dashboard.html docs/version-manifest.json
          git diff --cached --quiet && { echo 'Expected version identity correction'; exit 1; }
          git commit -m 'release(P0): normalize shell 800 version to v0.8.00 for public identity gates'
          git push origin HEAD:refs/heads/integrate/p0-belen-photo-pointer-strict-ack-v800-20261118
