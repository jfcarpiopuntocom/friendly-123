name: v670 cross-browser durable and photo convergence
on:
  pull_request:
    paths:
      - 'docs/relay-selector.js'
      - 'docs/sync-yjs.js'
      - 'test/relay-selector.test.cjs'
      - 'test/v670-cross-layer-photo-seed.test.cjs'
      - 'test/v670-post-pull-checkpoint.test.cjs'
      - 'test/incident-v608-publication-after-recovery.test.cjs'
      - 'test/yjs-expense-receipts.test.js'
      - '.github/workflows/v670-cross-browser-sync.yml'
  workflow_dispatch:
jobs:
  fallback-antientropy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source contracts
        run: |
          node --check docs/relay-selector.js
          node --check docs/sync-yjs.js
          node --check test/relay-selector.test.cjs
          node --check test/v670-cross-layer-photo-seed.test.cjs
          node --check test/v670-post-pull-checkpoint.test.cjs
      - name: Fetch immutable v606/v607 migration fixtures
        run: |
          git fetch --no-tags --depth=1 origin 82952a84958641010c48bfbee6aab80007ba12e9
          git show 82952a84958641010c48bfbee6aab80007ba12e9:docs/sync-yjs.js > /tmp/f123_v607_sync_yjs.js
          git fetch --no-tags --depth=1 origin 7e51ed51560d6138866dae98e4a01ff1772db51c
          git show 7e51ed51560d6138866dae98e4a01ff1772db51c:docs/sync-yjs.js > /tmp/f123_v606_sync_yjs.js
          test -s /tmp/f123_v607_sync_yjs.js
          test -s /tmp/f123_v606_sync_yjs.js
      - name: Reproduce missing cross-layer images and inventory antientropy
        env:
          F123_V607_SYNC_FILE: /tmp/f123_v607_sync_yjs.js
          F123_V606_SYNC_FILE: /tmp/f123_v606_sync_yjs.js
        run: |
          node --test --test-concurrency=1 \
            test/relay-selector.test.cjs \
            test/relay-sondas-v644.test.cjs \
            test/yjs-photo-seed-stable.test.js \
            test/v670-cross-layer-photo-seed.test.cjs \
            test/v670-post-pull-checkpoint.test.cjs \
            test/yjs-expense-receipts.test.js \
            test/v669-photo-pwa-durable-retry.test.cjs \
            test/stock-epoch-legacy-convergencia-v651.test.js \
            test/stock-epoch-legacy-convergence.test.cjs \
            test/incident-v608-publication-after-recovery.test.cjs \
            test/photo-integrity.test.js \
            test/e1b3-one-active-tab.test.cjs
