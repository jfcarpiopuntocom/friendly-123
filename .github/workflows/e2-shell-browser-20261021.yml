name: E2 browser takeover targeted
on:
  push:
    branches:
      - fix/e2-pwa-auto-shell-20261021
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify real Chromium SW takeover without external clients
        run: node --test test/e2-sw-real-browser.test.cjs
