name: P0 S3 encrypted checkpoint compression — JFC test room
on:
  pull_request:
    paths:
      - docs/sync-yjs.js
      - docs/sync-rollout.json
      - test/p0-rollout-policy.test.cjs
      - test/p0-s3-compressed-checkpoint.test.cjs
      - test/p0-s3-unknown-frame.test.cjs
      - test/p0-mixed-shell-v636.test.cjs
      - test/p0-s3-checkpoint-alert.test.cjs test/p0-rollout-policy.test.cjs
      - .github/workflows/p0-s3-compressed-checkpoint.yml
jobs:
  twice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --test test/p0-s3-compressed-checkpoint.test.cjs test/p0-s3-unknown-frame.test.cjs test/p0-s3-checkpoint-alert.test.cjs test/p0-rollout-policy.test.cjs
      - run: node --test test/p0-s3-compressed-checkpoint.test.cjs test/p0-s3-unknown-frame.test.cjs test/p0-s3-checkpoint-alert.test.cjs test/p0-rollout-policy.test.cjs
  mixed-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node --test test/p0-mixed-shell-v636.test.cjs
      - run: node --test test/p0-mixed-shell-v636.test.cjs
