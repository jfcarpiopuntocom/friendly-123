name: P0 local-first phase 1 snapshot core (NO RELEASE)
on:
  pull_request:
    paths:
      - docs/estado-idb.js
      - test/p0-local-first-snapshot-core-browser.test.cjs
      - .github/workflows/p0-local-first-phase1-core.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  local-snapshot-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Exact IDB transaction proof (synthetic only, no live sale wiring)
        run: node --test test/p0-local-first-snapshot-core-browser.test.cjs
