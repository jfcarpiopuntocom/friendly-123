name: C210 Safari old-shell escape and real PIN QA
on:
  push:
    branches: [fix/c210-safari-legacy-shell-escape-pin-update]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  seal-and-test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build executable app bundles and exact SHA256 manifest
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
          node --check docs/sw.js
          node --check docs/auth-ui.min.js
          node --check docs/app-inline-03.min.js
      - name: C210 and prior update contracts RED v890 to GREEN
        run: |
          set -euo pipefail
          node --test test/p0-c210-safari-release.test.cjs test/p0-c209-pin-layout-and-update.test.cjs test/p0-c209-reengage-lifecycle.test.cjs test/p0-c180-version-adoption.test.cjs test/p0-c185-single-sw-check.test.cjs test/p0-purge-url-and-startup.test.cjs
      - name: Actual WebKit and Chromium navigation from old cache-first SW, plus PIN layout
        run: |
          set -euo pipefail
          node --test test/p0-c210-safari-legacy-rescue.browser.cjs
          node --test test/p0-c209-pin-layout.browser.cjs
      - name: Release-control consistency against master
        run: |
          node scripts/release-control.cjs validate origin/master
          git diff --check
      - name: Commit only real generated browser assets
        run: |
          set -euo pipefail
          unexpected=$(git diff --name-only | grep -vE '^docs/(auth-ui\.min\.js|app-inline-03\.min\.js|version-manifest\.json)$' || true)
          test -z "$unexpected" || { printf 'Unexpected generated files:\n%s\n' "$unexpected"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/auth-ui.min.js docs/app-inline-03.min.js docs/version-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'release(C210): seal Safari v893 source-to-bundle and SHA256 assets'
            git push origin HEAD:fix/c210-safari-legacy-shell-escape-pin-update
          fi
