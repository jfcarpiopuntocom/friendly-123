# hotfix.yml — UN SOLO FLUJO: probar el area tocada y publicar a clientes (JFC 2026-10-14).
# Regla dura de JFC: "necesito hotfixear con MI velocidad, con fallback y rewind".
# Reemplaza la cadena publicar(/next/) -> release-control -> promover -> publicar.
#  1. Pruebas del area tocada (scripts/pruebas-del-area.cjs) + identidad de release + check-sw.
#  2. Si pasan: previo <- estable, estable <- este commit (solo hacia adelante, atomico).
#  3. Publica UNA vez (publicar.yml). friendly123.com/app lee estable solo.
# La suite completa sigue en release-control.yml, en paralelo: AVISA, no frena.
# Deshacer: workflow "deshacer" (Actions > deshacer > Run workflow) o el REWIND del panel.
name: hotfix

on:
  push:
    branches: [master]
    paths: ["docs/**"]
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hotfix
  cancel-in-progress: false

jobs:
  probar-y-mover:
    runs-on: ubuntu-24.04
    # v594: same official Playwright image as release-control.yml (browsers + OS libraries match
    # package-lock 1.62.1). Run 40504468263 stalled >10 min on apt in `playwright install-deps`.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    # v595: inside a container the default step shell is `sh -e`, which rejects `set -o pipefail`
    # (run 40514723204). Keep the host runner's previous default: bash -e.
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.promote.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Root in the official container must trust the checkout before git-based release steps.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # v594: browsers and OS deps come from the container image; no apt install, no browser cache.
      - name: Identidad de release y manifiesto
        env:
          BASE_SHA: origin/estable
        run: |
          node scripts/release-control.cjs validate "${BASE_SHA:-HEAD^}"
          bash check-sw.sh
      - name: Pin historic v607/v606 sync bridge fixtures at immutable SHAs (synthetic tests only)
        run: |
          git fetch --no-tags --depth=1 origin 82952a84958641010c48bfbee6aab80007ba12e9
          git show 82952a84958641010c48bfbee6aab80007ba12e9:docs/sync-yjs.js > /tmp/f123_v607_sync_yjs.js
          git fetch --no-tags --depth=1 origin 7e51ed51560d6138866dae98e4a01ff1772db51c
          git show 7e51ed51560d6138866dae98e4a01ff1772db51c:docs/sync-yjs.js > /tmp/f123_v606_sync_yjs.js
          test -s /tmp/f123_v607_sync_yjs.js
          test -s /tmp/f123_v606_sync_yjs.js
      - name: Pruebas del area tocada
        env:
          F123_V607_SYNC_FILE: /tmp/f123_v607_sync_yjs.js
          F123_V606_SYNC_FILE: /tmp/f123_v606_sync_yjs.js
          BASE_SHA: origin/estable
        run: |
          set -euo pipefail
          BASE="${BASE_SHA:-HEAD^}"
          git cat-file -e "$BASE" 2>/dev/null || BASE="HEAD^"
          node scripts/pruebas-del-area.cjs "$BASE" HEAD | tee /tmp/area.txt
          mapfile -t TESTS < /tmp/area.txt
          (( ${#TESTS[@]} > 0 )) || { echo "No hay pruebas focalizadas; no se publica"; exit 1; }
          # Heavy real-RTC three-browser tests need sole browser CPU/port ownership.
          # Run them FIRST, with every assertion intact; then run all remaining
          # targeted tests. Coverage always spans stable -> candidate, not only
          # the last intermediary push in an unpublished hotfix train.
          REGULAR=()
          PEER=false
          for t in "${TESTS[@]}"; do
            if [ "$t" = "test/peer-sync-browser.test.js" ]; then PEER=true
            else REGULAR+=("$t")
            fi
          done
          if [ "$PEER" = true ]; then
            node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/peer-sync-browser.test.js
          fi
          if (( ${#REGULAR[@]} )); then
            node --require ./test/helpers/sin-red-produccion.cjs --test --test-timeout=120000 "${REGULAR[@]}"
          fi
      - name: Mover ramas (previo <- estable, estable <- este commit)
        id: promote
        run: |
          set -euo pipefail
          git fetch -q origin estable master previo || git fetch -q origin estable master
          [ "$(git rev-parse origin/master)" = "$GITHUB_SHA" ] || { echo "Llego un commit mas nuevo: lo publica su propio hotfix"; exit 0; }
          ESTABLE=$(git rev-parse origin/estable)
          [ "$ESTABLE" = "$GITHUB_SHA" ] && { echo "estable ya esta aqui; no repetir publicacion"; exit 0; }
          git merge-base --is-ancestor "$ESTABLE" "$GITHUB_SHA" || { echo "estable no es ancestro: no se mueve"; exit 1; }
          git push --atomic origin "$ESTABLE:refs/heads/previo" "$GITHUB_SHA:refs/heads/estable"
          echo "candidate=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "previo=$ESTABLE estable=$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
  publicar:
    needs: probar-y-mover
    if: needs.probar-y-mover.outputs.candidate != ''
    uses: ./.github/workflows/publicar.yml
    with:
      candidate: ${{ needs.probar-y-mover.outputs.candidate }}
  # Oct14fixes 4: recorrer la app viva justo despues de publicar (solo lectura).
  recorrido:
    needs: publicar
    uses: ./.github/workflows/recorrido.yml
