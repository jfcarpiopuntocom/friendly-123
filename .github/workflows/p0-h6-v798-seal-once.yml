name: P0 H6 Casa v798 one-shot official seal
on:
  push:
    branches: [integrate/p0-belen-h6-casa-chain-v798-20261118]
    paths:
      - .github/workflows/p0-h6-v798-seal-once.yml
permissions: {contents: write}
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 'Build actual H6 dashboard, bump shell, validate official release'
        run: |
          set -euo pipefail
          node --test test/p0-belen-dashboard-hechos-chain.test.cjs test/p0-belen-hechos-chain-parity.test.cjs test/p0-belen-dashboard-hechos-readonly.test.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-dashboard-entry.cjs --check
          node - <<'NODE'
          const fs=require('node:fs');
          const get=p=>fs.readFileSync(p,'utf8');
          const put=(p,s)=>fs.writeFileSync(p,s);
          const v=JSON.parse(get('docs/version.json'));
          if(v.version!=='v0.7.97'||v.releaseName!=='v0.7.97'||
              v.shell!=='f123-shell-v797'||v.cacheGeneration!=='golden333')throw Error('unexpected v797 base');
          v.version='v0.7.98';v.releaseName='v0.7.98';v.shell='f123-shell-v798';v.cacheGeneration='golden334';v.fecha='2026-11-18';
          v.changelog='v0.7.98: Dashboard Casa verifica la secuencia y los hashes del historial financiero local antes de presentar sus importes como completos. Los registros faltantes, modificados o no verificables quedan pendientes de conciliacion. Sin alterar ventas, cobros, comisiones ni el transporte.';
          put('docs/version.json',JSON.stringify(v,null,2)+'\n');
          let sw=get('docs/sw.js');
          for(const [a,b] of [['const CACHE = "f123-shell-v797"','const CACHE = "f123-shell-v798"'],['const CACHE_GENERACION = "-golden333"','const CACHE_GENERACION = "-golden334"']]){
            if(sw.split(a).length!==2)throw Error('unexpected SW identity '+a);
            sw=sw.replace(a,b);
          }
          put('docs/sw.js',sw);
          let dashboard=get('docs/dashboard.html');
          for(const [a,b] of [
            ['name="dashboard-shell" content="f123-shell-v797"','name="dashboard-shell" content="f123-shell-v798"'],
            ['name="dashboard-release" content="v0.7.97"','name="dashboard-release" content="v0.7.98"'],
            ['Dashboard v0.7.97','Dashboard v0.7.98']
          ]){if(dashboard.split(a).length!==2)throw Error('unexpected Dashboard identity '+a);dashboard=dashboard.replace(a,b)}
          if(!dashboard.includes('<script src="./core/hechos-chain-readonly.js"></script>\n<script src="./dashboard-main.min.js"></script>'))throw Error('H6 helper is not loaded first');
          put('docs/dashboard.html',dashboard);
          NODE
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate dfa81fb9379e5b166d8072fd7613367c3d90c7a3
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version.json docs/dashboard.html docs/sw.js docs/version-manifest.json docs/dashboard-main.min.js docs/dashboard-main.min.css
          git diff --cached --quiet && { echo 'expected signed H6 build changes'; exit 1; }
          git commit -m 'release(P0 Belen H6): official Casa chain verifier v798 golden334'
          git push origin HEAD:refs/heads/integrate/p0-belen-h6-casa-chain-v798-20261118
