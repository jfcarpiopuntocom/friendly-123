name: qa-v448-golden2-photo-recovery-once

on:
  push:
    branches: [hotfix/v448-golden2-photo-recovery]
    paths:
      - ".github/workflows/qa-v448-golden2-photo-recovery-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v448-golden2-photo-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Photo loss regression
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/shelf-photo-durability-v449.test.js test/perchas-photo-selfheal-v446.test.js test/shelf-photo-integrity-v446.test.js test/photo-backup-evidence-v449.test.js test/backup-fotos.test.js
      - name: Golden generation contract
        run: node --test test/v448-golden-generation.test.js
      - name: WebKit iPhone photo smoke
        run: node .claude/smoke-v449-photo-webkit.cjs
      - name: Shelf lifecycle + zero stock + undo
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/shelf-lifecycle-race-v448.test.js test/perchas-hotfix-v444.test.js test/stock-zero-replay-v445.test.js test/deshacer-cancelacion-vencido.test.js test/devoluciones.test.js
      - name: Full regression
        run: npm test
      - name: Manifest and service-worker integrity
        run: |
          cp docs/version-manifest.json /tmp/version-manifest.before.json
          node scripts/gen-manifest.js
          diff -u /tmp/version-manifest.before.json docs/version-manifest.json
          bash check-sw.sh
          git fetch -q origin master
          git diff --check origin/master...HEAD
