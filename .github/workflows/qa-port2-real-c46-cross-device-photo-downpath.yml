name: PORT2 C46 · real Workerd browser photo cutover + cross-device A-B-A downpath
on:
  push:
    branches: [port2/20261119-c46-cross-device-photo-downpath-qa]
  pull_request:
    branches: [master]
    paths:
      - docs/idb-fotos.js
      - docs/application/recover-shelf-photo.js
      - docs/sync-yjs.js
      - docs/sync-realtime.js
      - cloudflare-yparty-worker/qa/p0-c46-cross-device-photo-and-downpath-workerd.test.mjs
      - .github/workflows/qa-port2-real-c46-cross-device-photo-downpath.yml
permissions: {contents: read}
jobs:
  c46-cross-device-photo-downpath:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 --test-timeout=120000 \
            qa/p0-c46-cross-device-photo-and-downpath-workerd.test.mjs
          cd ..
          bash check-sw.sh
