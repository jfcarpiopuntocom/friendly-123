name: P0 dashboard D2 quick periods source and calendar QA (no deploy)
on:
  pull_request:
    branches: [master]
    paths:
      - docs/core/report-period.js
      - docs/dashboard-finance.js
      - src/dashboard/dashboard-main.js
      - test/dashboard-d2-periodos-rapidos.test.js
      - .github/workflows/qa-live-dashboard-d2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d2-calendar-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact live source period and integration tests
        run: |
          set -euo pipefail
          mkdir -p evidence/dashboard-d2
          git rev-parse HEAD | tee evidence/dashboard-d2/head-sha.txt
          node --test test/dashboard-d2-periodos-rapidos.test.js 2>&1 | tee evidence/dashboard-d2/tap.log
      - name: Preserve RED GREEN TAP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-d2-${{ github.run_id }}
          path: evidence/dashboard-d2
          if-no-files-found: warn
          retention-days: 14
