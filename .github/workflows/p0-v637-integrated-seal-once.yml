name: P0 v637 integrated acceptance and exact SHA seal (one-shot)
on:
  push:
    branches: [fix/p0-legacy-worker-pin-route-404-20261031]
    paths: [".github/workflows/p0-v637-integrated-seal-once.yml"]
permissions:
  contents: write
concurrency:
  group: p0-v637-integrated-seal-once
  cancel-in-progress: false
jobs:
  verify-and-seal:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pin historical sync fixtures at immutable SHAs (synthetic only)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 82952a84958641010c48bfbee6aab80007ba12e9
          git show 82952a84958641010c48bfbee6aab80007ba12e9:docs/sync-yjs.js > /tmp/f123_v607_sync_yjs.js
          git fetch --no-tags --depth=1 origin 7e51ed51560d6138866dae98e4a01ff1772db51c
          git show 7e51ed51560d6138866dae98e4a01ff1772db51c:docs/sync-yjs.js > /tmp/f123_v606_sync_yjs.js
          test -s /tmp/f123_v607_sync_yjs.js
          test -s /tmp/f123_v606_sync_yjs.js
      - name: Verify real durable storage failure and recovered stock publication
        env:
          F123_V607_SYNC_FILE: /tmp/f123_v607_sync_yjs.js
          F123_V606_SYNC_FILE: /tmp/f123_v606_sync_yjs.js
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-failed-save-publication-gate.test.cjs test/incident-v608-publication-after-recovery.test.cjs test/ab-conflict-browser.test.cjs
      - name: PIN authority and proportional brand real browser regression
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-legacy-worker-pin-route-404.test.cjs test/p0-central-pin-legacy-offline-guard.test.cjs test/stable-store-wordmark-browser.test.cjs test/p0-proportional-business-name-browser.test.cjs test/p0-pre-pin-budget-and-header-parity.test.cjs
      - name: Check same v637 exact runtime assets and rebuild 121 SHA256 hashes
        run: |
          set -euo pipefail
          test "$(node -p "require('./docs/version.json').shell")" = f123-shell-v637
          test "$(node -p "require('./docs/version.json').cacheGeneration")" = golden184
          node scripts/gen-manifest.js
          bash check-sw.sh
          git diff --check
          wc -l docs/auth-ui.js docs/mock-backend.js docs/sw.js docs/version-manifest.json
          sha256sum docs/auth-ui.js docs/mock-backend.js docs/sw.js docs/version-manifest.json
      - name: Commit exactly the sealed manifest to isolated branch only
        run: |
          set -euo pipefail
          git add docs/sw.js docs/version-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release(candidate): reseal v637 tested durable-save gate and proportional wordmark'
            git push origin HEAD:fix/p0-legacy-worker-pin-route-404-20261031
          fi
