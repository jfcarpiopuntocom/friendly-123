name: C166 build actual Commissions app and dashboard
on:
  push:
    branches: [fix/c166-commissions-total-first-app-dashboard]
    paths:
      - .github/workflows/c166-commissions-autoseal.yml
      - docs/core/commission-history.js
      - src/app/app-inline-01.js
      - src/dashboard/dashboard-main.js
      - test/p0-c166-commissions-total-first.test.cjs
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c166-commissions-total-first-app-dashboard
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: RED to GREEN commercial commissions and duplicate-receipt tests
        run: |
          node --test test/p0-c166-commissions-total-first.test.cjs test/p0-belen-commissions-all-dates.test.cjs test/p0-c149-commission-split-order-identity.test.cjs test/p0-c151-single-payee-commission.test.cjs
      - name: Compile both real frontend entrypoints and seal integrity
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Commit exact compiled frontend assets ONLY to candidate branch
        run: |
          set -euo pipefail
          git config user.name "friendly-123 candidate seal"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(C166): seal v863 total-first app and dashboard"
            git push origin HEAD:refs/heads/fix/c166-commissions-total-first-app-dashboard
          fi
