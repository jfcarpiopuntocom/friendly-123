name: C181 seal PIN-only updates v874
on:
  push:
    branches: [fix/c181-pin-gate-update-before-login]
    paths:
      - .github/workflows/c181-seal-v874.yml
      - src/app/app-inline-03.js
      - docs/sw.js
      - docs/version.json
      - docs/dashboard.html
      - test/p0-c180-version-adoption.test.cjs
      - test/v607-invisible-auto-update.test.cjs
      - test/e2-sw-real-browser.test.cjs
      - test/p0-v603-update-consent-click.test.cjs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: c181-seal-v874
  cancel-in-progress: false
jobs:
  seal-and-test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c181-pin-gate-update-before-login
          fetch-depth: 0
          persist-credentials: true
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Deterministic bundle and manifest
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Seal exact assets to candidate branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(C181): seal v874 PIN-only updater and SHA256 manifest"
            git push origin HEAD:refs/heads/fix/c181-pin-gate-update-before-login
          fi
      - name: RED GREEN source bundle and historical updater tests
        run: |
          node --test test/p0-c180-version-adoption.test.cjs test/p0-v603-update-consent-click.test.cjs test/v607-invisible-auto-update.test.cjs test/p0-v732-tope-recarga-por-version.test.cjs
      - name: Real Chromium Service Worker, PIN and Updating splash
        run: node --test test/e2-sw-real-browser.test.cjs
