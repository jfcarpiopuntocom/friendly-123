name: P0 one-line integration contracts
on:
  push:
    branches:
      - integrate/p0-durability-owner-branding-one-release-20261031
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exactly one integration — no per-feature release seals
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin master --depth=100
          # Before final seal: no release artifacts may come from feature PRs.
          # After one single v639 seal: enforce the complete strict release identity.
          if git diff --name-only origin/master HEAD -- docs/version.json docs/sw.js docs/version-manifest.json | grep .; then
            node scripts/release-control.cjs validate "$(git merge-base origin/master HEAD)"
          fi
          git diff --check origin/master HEAD
      - name: Source and browser syntax
        run: |
          node --check docs/auth-ui.js
          node --check docs/mock-backend.js
          node --check cloudflare-worker/pin-worker-api.mjs
          node --check test/p0-failed-save-publication-gate.test.cjs
      - name: Owner PIN, server authority and fresh browser identity
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-pin-owner-resolve.test.mjs test/p0-pin-resolve-ui.test.cjs test/p0-central-pin-authority.test.mjs test/p0-central-pin-worker-entry.test.mjs
      - name: Fetch pinned historical Yjs scripts for legacy offline regression
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 82952a84958641010c48bfbee6aab80007ba12e9
          git show 82952a84958641010c48bfbee6aab80007ba12e9:docs/sync-yjs.js > /tmp/f123_v607_sync_yjs.js
          git fetch --no-tags --depth=1 origin 7e51ed51560d6138866dae98e4a01ff1772db51c
          git show 7e51ed51560d6138866dae98e4a01ff1772db51c:docs/sync-yjs.js > /tmp/f123_v606_sync_yjs.js
          test -s /tmp/f123_v607_sync_yjs.js
          test -s /tmp/f123_v606_sync_yjs.js
      - name: Durable recovery blocks unacknowledged stock publication
        env:
          F123_V607_SYNC_FILE: /tmp/f123_v607_sync_yjs.js
          F123_V606_SYNC_FILE: /tmp/f123_v606_sync_yjs.js
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-failed-save-publication-gate.test.cjs test/incident-v608-publication-after-recovery.test.cjs
      - name: Chromium + WebKit real rendered responsive brand
        run: node --test --test-timeout=120000 test/p0-business-ink-proportional.test.cjs
      - name: Causal physical ledger and read-only two-replica forensic contracts
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/stock-journal-*.test.cjs test/p0-replica-readonly-forensics.test.cjs
      - name: P0 monthly commission integrity — financial gate
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 test/p0-commission-period-integrity.test.cjs
      - name: Durable IDB, A/B conflict, and accepted wordmark smoke
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/incident-idb-payout-name-photo-race-4d-v2.test.cjs test/p0-pre-pin-budget-and-header-parity.test.cjs test/ab-conflict-browser.test.cjs
      - name: Recompute CSS parity and emit source-derived bytes when unequal
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), esbuild=require('esbuild');
          for(const [area,name] of [['app','app-style-02'],['dashboard','dashboard-main']]) {
            const source=fs.readFileSync('src/'+area+'/'+name+'.css','utf8');
            const built=esbuild.transformSync(source,{loader:'css',target:'es2020',minifySyntax:true,minifyWhitespace:true,minifyIdentifiers:false,legalComments:'none'}).code;
            const file='docs/'+name+'.min.css';
            if(fs.readFileSync(file,'utf8')===built){console.log('F123-CSS-PARITY-OK '+file);continue}
            fs.writeFileSync(file,built); // only the disposable CI checkout; no repo or client writes
            console.log('F123-CSS-COMPILED-START '+file);
            const b64=Buffer.from(built).toString('base64');
            for(let i=0;i<b64.length;i+=800)console.log(b64.slice(i,i+800));
            console.log('F123-CSS-COMPILED-END '+file);
          }
          NODE
      - name: Source inventory linecounts and exact checksums
        run: |
          wc -l docs/auth-ui.js docs/mock-backend.js cloudflare-worker/pin-worker-api.mjs
          sha256sum docs/auth-ui.js docs/mock-backend.js cloudflare-worker/pin-worker-api.mjs docs/app-style-02.min.css docs/dashboard-main.min.css
      - name: Preview exactly one new shell, manifest and SW (read-only CI — no push)
        run: node scripts/p0-one-release-preview.cjs

  latency:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Independent large-notebook A to B p95 measured without full-suite CPU contention
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=180000 test/sync-latencia-dos-aparatos-v599.test.cjs
