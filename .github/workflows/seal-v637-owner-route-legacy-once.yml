name: seal-v637-owner-route-legacy-once
on:
  push:
    branches: [fix/p0-legacy-worker-pin-route-404-20261031]
    paths: [".github/workflows/seal-v637-owner-route-legacy-once.yml"]
permissions:
  contents: write
concurrency:
  group: seal-v637-owner-route-legacy-once
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure exact v637 candidate and update SW plus dashboard identity
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const v = JSON.parse(fs.readFileSync('docs/version.json','utf8'));
          if (v.shell !== 'f123-shell-v637' || v.cacheGeneration !== 'golden184')
            throw Error('Unexpected version: refuse to seal');
          for (const [file, patches] of [
            ['docs/sw.js', [['const CACHE = "f123-shell-v636";','const CACHE = "f123-shell-v637";'],
                             ['const CACHE_GENERACION = "-golden183";','const CACHE_GENERACION = "-golden184";']]],
            ['docs/dashboard.html', [['content="f123-shell-v636"','content="f123-shell-v637"'],
                                     ['content="shell v636"','content="shell v637"'],
                                     ['Dashboard shell v636','Dashboard shell v637']]]
          ]) {
            let src = fs.readFileSync(file,'utf8');
            for(const [from,to] of patches){
              if(src.split(from).length !== 2) throw Error(file+' expected one exact occurrence of '+from);
              src = src.replace(from,to);
            }
            fs.writeFileSync(file,src);
          }
          NODE
          node scripts/gen-manifest.js
          bash check-sw.sh
          git diff --check
      - name: Owner credential regression (synthetic, no production calls)
        run: node --test --test-timeout=120000 test/p0-legacy-worker-pin-route-404.test.cjs test/p0-central-pin-legacy-offline-guard.test.cjs
      - name: Seal exact release bits only on isolated branch
        run: |
          set -euo pipefail
          wc -l docs/auth-ui.js docs/sw.js docs/dashboard.html docs/version.json docs/version-manifest.json
          sha256sum docs/auth-ui.js docs/sw.js docs/dashboard.html docs/version.json docs/version-manifest.json
          git add docs/sw.js docs/dashboard.html docs/version-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release(candidate): seal v637 Owner login fallback and 121 SHA256 assets'
          git push origin HEAD:fix/p0-legacy-worker-pin-route-404-20261031
