name: P0 LIVE dashboard D1 filters/totals · QA only, no deploy
on:
  pull_request:
    branches: [master]
    paths:
      - src/dashboard/dashboard-main.js
      - docs/dashboard-main.min.js
      - docs/version-manifest.json
      - test/p0-dashboard-d1-column-totals.test.cjs
      - test/p0-belen-dashboard-hechos-readonly.test.cjs
      - test/p0-belen-dashboard-hechos-browser.test.cjs
      - .github/workflows/p0-dashboard-d1-qa.yml
  push:
    branches: [fix/p0-belen-dashboard-facts-readonly-reasons-v793-20261118]
    paths:
      - src/dashboard/dashboard-main.js
      - docs/version.json
      - docs/dashboard.html
      - .github/workflows/p0-dashboard-d1-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d1-real-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fake-indexeddb for Belén actual source regression
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: RED-GREEN actual source D1 analysis and filtered sums
        run: |
          set -euo pipefail
          mkdir -p evidence/dashboard-d1
          git rev-parse HEAD | tee evidence/dashboard-d1/head.txt
          node --check src/dashboard/dashboard-main.js
          node --test test/p0-dashboard-d1-column-totals.test.cjs test/p0-belen-dashboard-hechos-readonly.test.cjs 2>&1 | tee evidence/dashboard-d1/tap.txt
      - name: Keep exact TAP+SHA even when failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-d1-${{ github.run_id }}
          path: evidence/dashboard-d1/
          if-no-files-found: warn
          retention-days: 14
  belen-finance-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chromium and WebKit real IndexedDB open/migration/read-only contract
        run: |
          npx playwright install --with-deps chromium webkit
          node --test test/p0-belen-dashboard-hechos-browser.test.cjs
  seal-v793-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/p0-belen-dashboard-facts-readonly-reasons-v793-20261118'
    permissions: {contents: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-belen-dashboard-facts-readonly-reasons-v793-20261118
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official Dashboard source build + manifested v793 shell, no deploy
        run: |
          set -euo pipefail
          node --test test/p0-belen-dashboard-hechos-readonly.test.cjs test/p0-dashboard-d1-column-totals.test.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          node scripts/release-control.cjs validate origin/master
          bash check-sw.sh
      - name: Commit byte-for-byte compiled assets only to this QA branch
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --short HEAD)" = "fix/p0-belen-dashboard-facts-readonly-reasons-v793-20261118"
          git add docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json
          if ! git diff --cached --quiet; then
            git -c user.name='friendly123-qa-build[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(v793): official dashboard finance facts source and hash manifest'
            git push origin HEAD:refs/heads/fix/p0-belen-dashboard-facts-readonly-reasons-v793-20261118
          fi
