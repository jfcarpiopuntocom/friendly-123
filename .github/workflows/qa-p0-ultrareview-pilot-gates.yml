name: P0 Ultrareview YParty confidential catalog and shadow readiness
on:
  push:
    branches: [integrate/p0-belen-opaque-coldjoin-v797-20261118]
  pull_request:
    paths:
      - src/yparty-piloto.js
      - docs/sync-yjs.js
      - test/p0-yparty-ultrareview-catalog-boundaries.test.cjs
      - .github/workflows/qa-p0-ultrareview-pilot-gates.yml
permissions:
  contents: read
jobs:
  encrypted-catalog-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: No raw Y.Doc and no premature legacy PIN authority
        run: node --test test/p0-yparty-ultrareview-catalog-boundaries.test.cjs
      - name: Certified owner-only YParty policy cannot spill to other licenses
        run: |
          node - <<'JS'
          const s=require('./docs/sync-rollout.json');
          const assert=require('node:assert/strict');
          const enabled=Object.entries(s.licenses||{}).filter(([,e])=>e.yparty===true);
          assert.equal(enabled.length,1,'only the existing JFC owner entry may opt into 2.0');
          assert.match(enabled[0][0],/^[a-f0-9]{64}$/,'license code must never be published');
          assert.match(enabled[0][1].frozenHead,/^[A-Za-z0-9_.:-]{3,128}$/,'certified baseline required');
          JS
