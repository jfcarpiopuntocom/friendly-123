name: p0-first-join-fasttrack
on:
  push:
    branches: [incident-v558-first-sync-integrity-20261021]
    paths:
      - "docs/sync-yjs.js"
      - "docs/sync-realtime.js"
      - "test/incident-*.test.js"
      - ".github/workflows/p0-first-join-fasttrack.yml"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: p0-fasttrack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native Node P0 22 targeted tests and causal-history regression
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=45000 \
            test/incident-first-sync-integrity-v558.test.js \
            test/incident-stale-stock-metadata-v558.test.js \
            test/incident-yjs-receive-queue-v558.test.js \
            test/incident-yjs-causal-replay-v559.test.js \
            test/yjs-unresolved-checkpoint.test.js
      - name: Integrity and syntax
        run: |
          node --check docs/sync-yjs.js
          node --check docs/sync-realtime.js
          bash check-sw.sh
          git diff --check
