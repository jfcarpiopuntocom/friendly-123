name: P0 v797 official one-shot seal
on:
  push:
    branches: [integrate/p0-belen-opaque-coldjoin-v797-20261118]
    paths:
      - .github/workflows/p0-v797-official-seal-once.yml
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 'Build real YParty pilot, bump shell, and verify official manifest'
        run: |
          set -euo pipefail
          npm ci --prefix cloudflare-yparty-worker --ignore-scripts --no-audit --no-fund
          NODE_PATH="$PWD/cloudflare-yparty-worker/node_modules" node scripts/build-yparty-piloto.cjs
          node - <<'NODE'
          const fs=require('node:fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const put=(p,s)=>fs.writeFileSync(p,s);
          const v=JSON.parse(read('docs/version.json'));
          if(v.version!=='v0.7.96'||v.shell!=='f123-shell-v796'||v.cacheGeneration!=='golden332')throw Error('unexpected version source');
          v.version='v0.7.97';v.releaseName='v0.7.97';v.shell='f123-shell-v797';v.cacheGeneration='golden333';v.fecha='2026-11-18';
          v.changelog='v0.7.97: previene la exposicion del catalogo sensible sin cifrar en YParty 2.0 y evita certificar PIN/cuaderno antes de completar la recuperacion cifrada heredada. El transporte anterior sigue activo y el piloto nuevo permanece apagado.';
          put('docs/version.json',JSON.stringify(v,null,2)+'\n');
          let sw=read('docs/sw.js');
          if(sw.split('const CACHE = "f123-shell-v796"').length!==2||sw.split('const CACHE_GENERACION = "-golden332"').length!==2)throw Error('unexpected SW');
          sw=sw.replace('const CACHE = "f123-shell-v796"','const CACHE = "f123-shell-v797"').replace('const CACHE_GENERACION = "-golden332"','const CACHE_GENERACION = "-golden333"');
          put('docs/sw.js',sw);
          let dash=read('docs/dashboard.html');
          for(const [a,b] of [
            ['name="dashboard-shell" content="f123-shell-v796"','name="dashboard-shell" content="f123-shell-v797"'],
            ['name="dashboard-release" content="v0.7.96"','name="dashboard-release" content="v0.7.97"'],
            ['Dashboard v0.7.96','Dashboard v0.7.97']
          ]){if(dash.split(a).length!==2)throw Error('unexpected dashboard identity '+a);dash=dash.replace(a,b);}
          put('docs/dashboard.html',dash);
          NODE
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate 7a8d2584338d1540fcd9789cc889c8e2a1592968
          node --test test/p0-yparty-ultrareview-catalog-boundaries.test.cjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version.json docs/dashboard.html docs/sw.js docs/version-manifest.json docs/vendor/yparty-piloto.min.js
          git diff --cached --quiet && { echo 'no changes expected to seal'; exit 1; }
          git commit -m 'release(P0 Belen): official opaque catalog boundary v797 golden333'
          git push origin HEAD:refs/heads/integrate/p0-belen-opaque-coldjoin-v797-20261118
