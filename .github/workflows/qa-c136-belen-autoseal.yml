name: C136 Belén dual-Commissions deterministic asset seal
on:
  push:
    branches: [feat/belen-commissions-all-history-20261121]
    paths:
      - .github/workflows/qa-c136-belen-autoseal.yml
      - src/app/app-inline-01.js
      - src/dashboard/dashboard-main.js
      - docs/core/commission-history.js
      - docs/index.html
      - docs/dashboard.html
      - docs/version.json
permissions: {contents: write}
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/belen-commissions-all-history-20261121
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Official app and dashboard build
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Belén and exact monthly-money source regressions
        run: node --test test/p0-belen-commissions-all-dates.test.cjs test/dashboard-settlement-corrections.test.js test/p0-commission-month-guard.test.cjs
      - name: Commit exact reproducible assets to candidate only
        run: |
          set -euo pipefail
          git config user.name "friendly-123 release seal"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(C136): seal app and dashboard full-history source after P0 fixes"
            git push origin HEAD:refs/heads/feat/belen-commissions-all-history-20261121
          fi
