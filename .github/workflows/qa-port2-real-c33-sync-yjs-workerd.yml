name: PORT2 C33 · real Workerd SQLite E2E of docs/sync-yjs.js C31 cutover
on:
  push:
    branches: [port2/20261119-c33-sync-yjs-workerd-e2e]
  pull_request:
    branches: [master]
    paths:
      - docs/sync-yjs.js
      - docs/vendor/yparty-piloto.min.js
      - cloudflare-yparty-worker/qa/p0-c33-sync-yjs-cutover-workerd.test.mjs
      - .github/workflows/qa-port2-real-c33-sync-yjs-workerd.yml
permissions: {contents: read}
jobs:
  c33-sync-yjs-workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 --test-timeout=120000 \
            qa/p0-c33-sync-yjs-cutover-workerd.test.mjs
