name: "PORT2 REAL C10 · single public catalog writer"
on:
  push:
    branches: [port2/20261119-c10-single-cat-writer]
  pull_request:
    branches: [master]
    paths:
      - cloudflare-yparty-worker/src/index.js
      - cloudflare-yparty-worker/qa/p0-secure-separate-rooms.test.mjs
      - .github/workflows/qa-port2-real-c10-single-writer.yml
permissions: {contents: read}
jobs:
  workerd-single-writer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual Workerd + central issuer + two independent cat Owners
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          git rev-parse HEAD
          # Run the added C10 test in a fresh synthetic authority; otherwise
          # extra Owner tickets can exhaust the *shared test fixture* quota.
          node --test --test-name-pattern='P0 C10' --test-concurrency=1 --test-timeout=90000 qa/p0-secure-separate-rooms.test.mjs
          # The fixture enforces an intentionally strict per-instance issuer
          # rate quota. Partition existing regression tests across independent
          # fresh authority instances, preserving every original assertion.
          node --test --test-name-pattern='P0 (actual|independent|backwards-compatible|real Workerd photo|photo upload|real Workerd photo CORS)' --test-concurrency=1 --test-timeout=90000 qa/p0-secure-separate-rooms.test.mjs
          node --test --test-name-pattern='P0 (Team|real Worker typed|browser HTTPS|cold join burst|combined REAL photo|genuine cold join)' --test-concurrency=1 --test-timeout=90000 qa/p0-secure-separate-rooms.test.mjs
