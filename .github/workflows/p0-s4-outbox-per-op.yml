name: P0 S4 per-operation IndexedDB outbox, JFC test shop
on:
  pull_request:
    paths: [docs/sync-yjs.js, docs/sync-rollout.json, test/p0-rollout-policy.test.cjs, test/p0-s4-outbox-per-op.test.cjs, .github/workflows/p0-s4-outbox-per-op.yml]
jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install synthetic IndexedDB emulator outside repository
        run: npm install --no-save --prefix "$RUNNER_TEMP/p0-s4-idb" fake-indexeddb --ignore-scripts --no-audit --no-fund
      - run: NODE_PATH="$RUNNER_TEMP/p0-s4-idb/node_modules" node --test test/p0-s4-outbox-per-op.test.cjs test/p0-rollout-policy.test.cjs
      - run: NODE_PATH="$RUNNER_TEMP/p0-s4-idb/node_modules" node --test test/p0-s4-outbox-per-op.test.cjs test/p0-rollout-policy.test.cjs
