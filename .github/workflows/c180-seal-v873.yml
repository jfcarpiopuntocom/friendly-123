name: C180 prepare sealed v873 update shell
on:
  push:
    branches:
      - fix/c180-restore-safe-auto-version-adoption
    paths:
      - .github/workflows/c180-seal-v873.yml
      - src/app/app-inline-03.js
      - docs/sw.js
      - docs/version.json
      - docs/dashboard.html
      - test/p0-c180-version-adoption.test.cjs
      - test/p0-v732-tope-recarga-por-version.test.cjs
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: c180-seal-v873
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c180-restore-safe-auto-version-adoption
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Official build and deterministic SHA-256 integrity manifest
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Seal candidate artifacts only on C180 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(C180): seal v873 exact generated assets and manifest"
            git push origin HEAD:refs/heads/fix/c180-restore-safe-auto-version-adoption
          fi
      - name: Focused source, bundle, lifecycle and historical compatibility
        run: |
          node --test test/p0-c180-version-adoption.test.cjs test/p0-v603-update-consent-click.test.cjs test/p0-v732-tope-recarga-por-version.test.cjs test/v607-invisible-auto-update.test.cjs
