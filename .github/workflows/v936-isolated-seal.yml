name: Isolated v936 candidate seal (no deploy)
on:
  push:
    branches: [fix/v936-restore-tree-proof-20261127]
    paths: ['src/app/app-inline-03.js', 'test/p0-sw-identity-protocol.test.cjs', 'docs/cartera.js', 'docs/plan-pagos-ui.js', 'src/pago-intento-idb.mjs', 'test/p0-commerce-integrity.test.cjs', '.github/workflows/v936-isolated-seal.yml']
permissions:
  contents: write
jobs:
  seal:
    if: github.ref == 'refs/heads/fix/v936-restore-tree-proof-20261127'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Exact projection regression
        run: node --test --test-name-pattern="historical restored debt" test/p0-commerce-integrity.test.cjs
      - name: Build and validate canonical assets
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
          git diff --check
      - name: Native browser and ledger generation regressions
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-belen-payment-intent-idb.test.cjs test/p0-belen-idb-live-payment.test.cjs test/p0-belen-idb-live-browser.test.cjs
      - name: PIN protocol and real browser takeover regressions
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-sw-identity-protocol.test.cjs test/p0-c180-version-adoption.test.cjs test/e2-sw-real-browser.test.cjs test/p0-sw-document-affinity.test.cjs
      - name: Seal only the isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-03.min.js docs/cartera.min.js docs/plan-pagos-ui.min.js docs/version-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(v936): seal PIN identity protocol"
            git push origin HEAD:refs/heads/fix/v936-restore-tree-proof-20261127
          fi
