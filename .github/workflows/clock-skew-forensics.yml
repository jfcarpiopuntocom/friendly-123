name: clock-skew-forensics

on:
  push:
    branches:
      - "forensics/clock-skew-2026-10-03"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused clock-skew tests
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/clock-skew-forensics-v447.test.js
      - name: Full suite
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/*.test.js
      - name: Historical browser smokes
        run: |
          python3 -m http.server 8127 --directory docs >/tmp/f123-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          node .claude/smoke-multiprompt.cjs
          node .claude/smoke-expira-evento.cjs
      - name: Install external judges
        run: npm install --no-save --package-lock=false @axe-core/playwright lighthouse
      - name: External UI judges
        run: |
          node scripts/jueces.mjs
          cat out-jueces/resultado.json
          node -e "const r=require('./out-jueces/resultado.json'); if(r.rojo){console.error(r.motivos); process.exit(1)}"
      - name: Generate deterministic manifest preview
        run: |
          node scripts/gen-manifest.js
          git diff --exit-code -- docs/version-manifest.json
          echo '---MANIFEST-BEGIN---'
          cat docs/version-manifest.json
          echo '---MANIFEST-END---'
      - name: Service-worker and release guards
        run: bash check-sw.sh
      - name: Diff hygiene
        run: git diff --check origin/master...HEAD
