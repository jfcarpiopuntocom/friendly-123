name: C166 Seal live Commissions app and dashboard bundles
on:
  push:
    branches: [fix/c166-commissions-total-first-app-dashboard]
    paths:
      - .github/workflows/qa-c166-commission-seal.yml
      - docs/core/commission-history.js
      - src/app/app-inline-01.js
      - src/dashboard/dashboard-main.js
      - test/p0-c166-commissions-total-first.test.cjs
      - docs/version.json
      - docs/dashboard.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c166-commissions-total-first-app-dashboard
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: RED-to-GREEN real economic and both UI regressions
        run: |
          node --test test/p0-c166-commissions-total-first.test.cjs test/p0-belen-commissions-all-dates.test.cjs test/p0-c142-commission-conflict-local-day.test.cjs test/p0-c151-single-payee-commission.test.cjs
      - name: Rebuild official app/dashboard and seal version manifest
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Commit exact generated assets to this candidate branch only
        run: |
          set -euo pipefail
          git config user.name "friendly-123 release seal"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(C166): seal live Commissions v863 bundles and SHA manifest"
            git push origin HEAD:refs/heads/fix/c166-commissions-total-first-app-dashboard
          fi
