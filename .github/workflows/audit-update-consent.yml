name: audit-update-consent-only
on:
  push:
    branches:
      - audit/v603-update-consent
jobs:
  visible-consent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run two user-visible update-consent contracts (expected RED on Claude candidate)
        run: |
          node --test test/audit-v603-update-consent.red.test.cjs
