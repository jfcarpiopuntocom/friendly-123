name: P0 Belén v800 official photo ACK shell seal ONE SHOT
on:
  push:
    branches: [integrate/p0-belen-photo-pointer-strict-ack-v800-20261118]
    paths: [.github/workflows/p0-v800-photo-ack-seal-once.yml]
permissions: {contents: write}
jobs:
  official-photo-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 'Run full photo pointer exact source coverage before signing'
        run: |
          node --check docs/vista-perchas.js
          node --test test/p0-belen-photo-recovery-pointer-strict-ack.test.cjs test/p0-belen-photo-pointer-ack-real-source.test.cjs
      - name: 'Seal official v800 shell, Hash Manifest, release continuity and committed assets'
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node - <<'NODE'
          const fs=require('node:fs');
          const get=p=>fs.readFileSync(p,'utf8');
          const put=(p,s)=>fs.writeFileSync(p,s);
          const v=JSON.parse(get('docs/version.json'));
          if(v.version!=='v0.7.99'||v.releaseName!=='v0.7.99'||v.shell!=='f123-shell-v799'||v.cacheGeneration!=='golden335')throw Error('Unexpected source release');
          v.version='v0.7.100';v.releaseName='v0.7.100';v.shell='f123-shell-v800';v.cacheGeneration='golden336';v.fecha='2026-11-18';
          v.changelog='v0.7.100: la recuperacion de fotos de perchas exige ACK HTTP explicito y el mismo cuaderno durante escrituras asincronas. Preserva bytes, historial de fotos y avisos; ningun enlace con respuesta ausente o fallida se confirma.';
          put('docs/version.json',JSON.stringify(v,null,2)+'\n');
          let sw=get('docs/sw.js');
          for(const [a,b] of [['const CACHE = "f123-shell-v799"','const CACHE = "f123-shell-v800"'],['const CACHE_GENERACION = "-golden335"','const CACHE_GENERACION = "-golden336"']]){
            if(sw.split(a).length!==2)throw Error('SW expected identity not found once '+a);
            sw=sw.replace(a,b);
          }
          put('docs/sw.js',sw);
          let dash=get('docs/dashboard.html');
          for(const [a,b] of [
            ['name="dashboard-shell" content="f123-shell-v799"','name="dashboard-shell" content="f123-shell-v800"'],
            ['name="dashboard-release" content="v0.7.99"','name="dashboard-release" content="v0.7.100"'],
            ['Dashboard v0.7.99','Dashboard v0.7.100']
          ]){if(dash.split(a).length!==2)throw Error('Dashboard expected identity not found once '+a);dash=dash.replace(a,b)}
          put('docs/dashboard.html',dash);
          NODE
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate 1c9b476cb5ad371e7e84012a6b5a8bb5984377a4
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/version.json docs/sw.js docs/dashboard.html docs/version-manifest.json
          git diff --cached --quiet && { echo 'Unexpected no-op release'; exit 1; }
          git commit -m 'release(P0 Belén): official photo ACK v800 golden336'
          git push origin HEAD:refs/heads/integrate/p0-belen-photo-pointer-strict-ack-v800-20261118
