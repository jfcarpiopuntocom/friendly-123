name: P0 sale critical-path synthetic benchmark
on:
  pull_request:
    branches: [master]
    paths:
      - scripts/lab-venta-latencia.js
      - docs/mock-backend.js
      - docs/estado-ab.js
      - docs/estado-idb.js
      - test/p0-sales-atomic-idb-webkit-browser.test.cjs
      - docs/ADR-P0-ventas-rapidas.md
      - .github/workflows/p0-sale-speed-lab.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  synthetic-sale-timing:
    name: Sales A/B and serialization latency (synthetic only)
    runs-on: ubuntu-24.04
    # Same pinned image as release-control / two-tab sales: OS dependencies and
    # Chromium/WebKit preinstalled, avoiding apt mirror stalls before app tests.
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Same as the verified release-control container workflow: checkout
      # ownership must be trusted before invoking git within Playwright image.
      - name: Trust container checkout and verify git worktree
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --is-inside-work-tree | grep -qx true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify timing tool syntax
        run: node --check scripts/lab-venta-latencia.js
      - name: Benchmark 1, 300, and 1000 products (no client data)
        timeout-minutes: 4
        run: node scripts/lab-venta-latencia.js
      - name: Install pinned browser test harness
        run: npm ci --ignore-scripts
      - name: Chromium and Safari-WebKit two-tab atomic sales (synthetic)
        run: node --test test/p0-sales-atomic-idb-webkit-browser.test.cjs
      - name: Validate changed JavaScript syntax
        run: |
          node --check docs/mock-backend.js
          node --check docs/estado-ab.js
          node --check docs/estado-idb.js
      - name: Diff hygiene
        run: git diff --check
