name: P0 quota source preservation and retry acceptance
on:
  push:
    branches: [fix/p0-legacy-worker-pin-route-404-20261031]
    paths: [".github/workflows/p0-idb-quota-once.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test live browser quota classification with actual IndexedDB.put throwing
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/v608-guardado-veraz.test.cjs
      - name: Preserve existing money/stock and CAS durability proofs
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/incident-idb-payout-name-photo-race-4d-v2.test.cjs test/p0-failed-save-publication-gate.test.cjs
