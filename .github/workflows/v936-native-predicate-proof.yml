name: v936 native predicate proof (isolated)
on:
  push:
    branches: [fix/v936-await-native-predicate-20261127]
    paths: ['test/**', '.github/workflows/v936-native-predicate-proof.yml']
permissions:
  contents: read
jobs:
  proof:
    if: github.ref == 'refs/heads/fix/v936-await-native-predicate-20261127'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Native negative and positive controls
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-timeout=30000 test/p0-native-async-wait.test.cjs
      - name: Three independent executions of unchanged affinity and PIN assertions
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "TRIAL $i"
            node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-sw-document-affinity.test.cjs test/e2-sw-real-browser.test.cjs
          done
