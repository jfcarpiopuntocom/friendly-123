name: promote-v448-golden11-once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/promote-v448-golden11-once.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      done: ${{ steps.p.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: p
        name: Atomic G10 -> G10b promotion
        run: |
          set -euo pipefail
          CANDIDATE="b0ebe5a927f29d8c0ec5001e9f90b9fe4b9c7f0a"
          OLD_STABLE="047dd448d03d2253a35dffeb7b74c7f6e2bbbf15"
          OLD_PREVIO="7854a6dd3797229e2ce837668be73248ebb2a7c4"

          git fetch -q origin master estable previo
          test "$(git rev-parse origin/estable)" = "$OLD_STABLE"
          test "$(git rev-parse origin/previo)" = "$OLD_PREVIO"
          git merge-base --is-ancestor "$CANDIDATE" origin/master

          git show "$CANDIDATE:docs/version.json" | jq -e '
            .shell == "f123-shell-v448" and
            .releaseName == "v448 GOLDEN" and
            .cacheGeneration == "golden11"
          ' >/dev/null
          git show "$CANDIDATE:docs/sw.js" | grep -q 'const CACHE_GENERACION = "-golden11"'

          git push --atomic             "--force-with-lease=refs/heads/estable:$OLD_STABLE"             "--force-with-lease=refs/heads/previo:$OLD_PREVIO"             origin             "$OLD_STABLE:refs/heads/previo"             "$CANDIDATE:refs/heads/estable"

          echo "done=yes" >> "$GITHUB_OUTPUT"
          echo "previo=$OLD_STABLE estable=$CANDIDATE"

  publicar:
    needs: promote
    if: needs.promote.outputs.done == 'yes'
    uses: ./.github/workflows/publicar.yml
