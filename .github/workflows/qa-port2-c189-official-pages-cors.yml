name: PORT2 C189 · official GitHub Pages CORS (real Workerd)
on:
  push:
    branches: [port2/c189-official-pages-cors]
  pull_request:
    branches: [master]
    paths:
      - cloudflare-yparty-worker/src/index.js
      - cloudflare-yparty-worker/qa/p0-c189-official-pages-cors-workerd.test.mjs
      - .github/workflows/qa-port2-c189-official-pages-cors.yml
permissions: {contents: read}
jobs:
  c189-official-pages-cors:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 --test-timeout=120000 qa/p0-c189-official-pages-cors-workerd.test.mjs
