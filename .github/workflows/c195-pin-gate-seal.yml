name: C195 PIN gate sync-burst render and exact shell seal
on:
  push:
    branches:
      - fix/p0-c195-pin-gate-render-noop
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce-build-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C195 PIN gate source-executed 1000 sync bursts + old PIN contracts
        run: |
          node --check docs/auth-ui.js
          node --test test/p0-c195-pin-gate-repaint-burst.test.cjs test/pin-keypad-response.test.cjs test/p0-v754-pin-local-primero.test.cjs test/p0-v769-pin-espera.test.cjs test/p0-owner-pin-current-ui-browser.test.cjs test/p0-owner-pin-pencils-repaint.test.cjs
      - name: Rebuild all official app assets and SHA256 manifest
        run: |
          node scripts/build-app-entry.cjs
          node scripts/gen-manifest.js
          node scripts/build-app-entry.cjs --check
          bash check-sw.sh
          node --check docs/app-inline-01.min.js
      - name: Verify latest source and shipped manifest are consistent
        run: |
          node --test test/p0-c195-pin-gate-repaint-burst.test.cjs test/pin-keypad-response.test.cjs
          git diff --check
      - name: Commit exact generated bundle and manifest to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/app-inline-01.min.js docs/app-inline-02.min.js docs/app-inline-03.min.js docs/app-inline-04.min.js docs/app-inline-05.min.js docs/app-inline-06.min.js docs/app-inline-07.min.js docs/app-style-01.min.css docs/app-style-02.min.css docs/app-style-03.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'release(C195): seal v882 login assets and exact SHA256 hashes'
            git push origin HEAD:fix/p0-c195-pin-gate-render-noop
          fi
