name: g08-manifest-once

on:
  push:
    branches: ["hotfix/v448-golden-shelf-photo-checkpoints"]
    paths: [".github/workflows/g08-manifest-once.yml"]

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v448-golden-shelf-photo-checkpoints
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-manifest.js
      - run: |
          set -euo pipefail
          if git diff --quiet -- docs/version-manifest.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version-manifest.json
          git commit -m "integrity(v448 GOLDEN G08): refresh manifest after Vault harness fix"
          git push origin HEAD:hotfix/v448-golden-shelf-photo-checkpoints
