name: P0 v636 seal bounded RTC peer ACK retries
on:
  push:
    branches: [fix/p0-active-notebook-v636-20261031]
    paths: [.github/workflows/p0-v636-reseal-rtc-once.yml]
permissions:
  contents: write
jobs:
  verify-seal:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax, line count, SHA256 source and durable retries
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --check docs/peer-sync.js
          node --check docs/sync-realtime.js
          wc -l docs/peer-sync.js docs/sync-realtime.js
          sha256sum docs/peer-sync.js docs/sync-realtime.js
          node --test --test-timeout=90000 --test-concurrency=1 test/sync-peer-durable.test.js test/p0-opid-before-yjs.test.cjs test/native-sync-required.test.js
          node --test --test-timeout=90000 --test-concurrency=1 test/peer-sync-browser.test.js
      - name: Regenerate exact integrity manifest without inventing new shell
        run: |
          set -euo pipefail
          test "$(node -p "require('./docs/version.json').shell")" = 'f123-shell-v636'
          test "$(node -p "require('./docs/version.json').cacheGeneration")" = 'golden183'
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate origin/master
          git diff --check
          git diff --stat
      - name: Commit SHA256 for changed peer-sync.js only
        run: |
          set -euo pipefail
          git config user.name "friendly-123 release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version-manifest.json
          git diff --cached --quiet && exit 1
          git commit -m "release(candidate): seal bounded retry RTC v636 manifest after WebKit forensic"
          git push origin HEAD:refs/heads/fix/p0-active-notebook-v636-20261031
