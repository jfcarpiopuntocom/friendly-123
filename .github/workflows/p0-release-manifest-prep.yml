name: P0 build exact shell manifest on isolated release branch
on:
  push:
    branches:
      - release/p0-local-first-jfc-health-v726-20261111
    paths:
      - .github/workflows/p0-release-manifest-prep.yml
      - src/app/app-inline-01.js
      - docs/mock-backend.js
      - docs/estado-idb.js
      - docs/salud-app.js
      - docs/dashboard.html
      - docs/version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p0-local-first-jfc-health-v726-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact lockfile dependencies for production app build
        run: npm ci --no-audit --no-fund
      - name: Generate production assets and manifest using OFFICIAL scripts
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate origin/master
      - name: Commit official generated manifest to the CANDIDATE branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(P0): seal v726 manifest with official gen-manifest.js"
            git push origin HEAD:refs/heads/release/p0-local-first-jfc-health-v726-20261111
          fi
