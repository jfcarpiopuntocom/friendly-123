name: P0 build exact shell manifest on isolated release branch
on:
  push:
    branches:
      - release/p0-local-first-jfc-health-v726-20261111
    paths:
      - .github/workflows/p0-release-manifest-prep.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/p0-local-first-jfc-health-v726-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate manifest using official script and validate exact shell
        run: |
          set -euo pipefail
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate origin/master
      - name: Commit official generated manifest to the CANDIDATE branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(P0): seal v726 manifest with official gen-manifest.js"
            git push origin HEAD:refs/heads/release/p0-local-first-jfc-health-v726-20261111
          fi
