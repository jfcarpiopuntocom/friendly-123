name: PORT2 C44 · ajuste y abono 2.0 envelope + opId contract
on:
  push:
    branches: [port2/20261119-c44-ajuste-abono-cutover-v819]
  pull_request:
    branches: [master]
    paths:
      - docs/mock-backend.js
      - docs/sync-realtime.js
      - docs/sync-yjs.js
      - test/p0-c44-ajuste-abono-envelope-and-opid.test.cjs
      - .github/workflows/qa-port2-real-c44-ajuste-abono.yml
permissions: {contents: read}
jobs:
  c44-ajuste-abono-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 --test-timeout=120000 \
            test/p0-c44-ajuste-abono-envelope-and-opid.test.cjs \
            test/p0-c34-real-sale-envelope-contract.test.cjs \
            test/p0-c36-real-sale-opid-e2e.test.cjs \
            test/p0-c31-runtime-commercial-photo-role-cutover.test.cjs \
            test/p0-architecture-2-port-score.test.cjs
          bash check-sw.sh
