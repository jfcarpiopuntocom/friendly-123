name: P0 friendly license Worker capability check (read-only)
on:
  push:
    branches: [fix/p0-legacy-worker-pin-route-404-20261031]
    paths: [".github/workflows/p0-worker-availability-once.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check all original license/PIN contracts on synthetic data
        run: node --test --test-concurrency=1 --test-timeout=120000 test/worker-checkin.test.js test/p0-central-pin-authority.test.mjs test/p0-central-pin-worker-entry.test.mjs test/panel-durable-object.test.js
      - name: Verify existing official deployment identity and required secrets without disclosure
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Friendly Cloudflare deploy token not configured in this repository"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Friendly Cloudflare account ID not configured in this repository"; exit 1; }
          test "$(sed -n 's/^name = "\(.*\)"/\1/p' wrangler.toml | head -1)" = 'friendly123-licencias'
          ../node_modules/.bin/wrangler deploy --config ./wrangler.toml --dry-run > "$RUNNER_TEMP/friendly-pin-worker-probe.txt"
          grep -q 'env.LICENCIAS' "$RUNNER_TEMP/friendly-pin-worker-probe.txt"
          grep -q 'env.REGISTROS' "$RUNNER_TEMP/friendly-pin-worker-probe.txt"
          echo "PASS official name, encrypted PIN route, KV and durable object bindings (no deploy)"
