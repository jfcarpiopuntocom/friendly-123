name: Sync3 A-B-C transport safety
on:
  pull_request:
    paths:
      - 'src/sync3-silent-cascade.mjs'
      - 'tests/sync3-silent-cascade.test.mjs'
      - 'tests/sync3-activation-race.test.mjs'
      - 'src/port2-cross-device-failback.mjs'
      - '.github/workflows/sync3-cascade.yml'
      - 'docs/vendor/yparty-piloto.min.js'
      - 'docs/version-manifest.json'
      - 'docs/sw.js'
      - 'docs/version.json'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check src/sync3-silent-cascade.mjs
      - name: Regression tests
        run: node --test tests/sync3-silent-cascade.test.mjs tests/sync3-activation-race.test.mjs
      - name: Compile exact browser bundle for source-to-runtime verification
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix cloudflare-yparty-worker --ignore-scripts --no-audit --no-fund
          NODE_PATH="$PWD/cloudflare-yparty-worker/node_modules" node scripts/build-yparty-piloto.cjs
          node scripts/gen-manifest.js
          sha256sum docs/dashboard.html
          git diff --exit-code -- docs/vendor/yparty-piloto.min.js docs/version-manifest.json docs/sw.js
