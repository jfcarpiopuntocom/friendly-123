name: Sync3 A-B-C transport safety
on:
  pull_request:
    paths:
      - 'src/sync3-silent-cascade.mjs'
      - 'tests/sync3-silent-cascade.test.mjs'
      - '.github/workflows/sync3-cascade.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: node --check src/sync3-silent-cascade.mjs
      - name: Regression tests
        run: node --test tests/sync3-silent-cascade.test.mjs
