name: diagnose-v448-g07-photo-tests-once

on:
  push:
    branches: [hotfix/v448-golden-hex-photo-core]
    paths:
      - ".github/workflows/diagnose-v448-g07-photo-tests-once.yml"

permissions:
  contents: read

jobs:
  photo-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run photo regressions one file at a time
        run: |
          set -euo pipefail
          for f in             test/perchas-photo-selfheal-v446.test.js             test/shelf-photo-integrity-v446.test.js             test/shelf-photo-durability-v449.test.js             test/shelf-photo-legacy-g03.test.js             test/photo-history-g05.test.js             test/photo-backup-evidence-v449.test.js             test/backup-fotos.test.js
          do
            echo "===== $f ====="
            timeout 120s node --require ./test/helpers/sin-red-produccion.cjs --test "$f"
          done
