name: P0 v696 candidate real Firebase synthetic cold-join diagnostic (NOT release)
on:
  pull_request:
    paths:
      - '.github/workflows/qa-v696-candidate-firebase-coldjoin.yml'
      - 'docs/sync-yjs.js'
      - 'docs/relay-selector.js'
      - 'docs/version.json'
      - 'docs/version-manifest.json'
permissions:
  contents: read
jobs:
  preview-synthetic-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 8
    steps:
      - name: Checkout candidate without persistence credentials
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout exact safe QA observer source without modifying candidate
        uses: actions/checkout@v4
        with:
          repository: jfcarpiopuntocom/friendly-123
          ref: 6b269a2991b04cfb7d50ee213380ed44f4094a62
          path: observer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned app dependencies
        working-directory: candidate
        run: npm ci
      - name: Browser QA: real candidate files + passive synthetic-only Firebase observation
        working-directory: candidate
        shell: bash
        env:
          F123_CANARIO_LICENCIA: ${{ secrets.F123_CANARIO_LICENCIA }}
          F123_CANARIO_SOLO_OBSERVAR: '1'
        run: |
          set -euo pipefail
          test -n "${F123_CANARIO_LICENCIA:-}" || { echo 'CANARIO_CONFIG: synthetic QA licence missing; no test executed'; exit 2; }
          cp ../observer/scripts/canario-union-fria.cjs scripts/qa-preview-union-fria.cjs
          # The installed Chromium ships with the pinned Playwright container.
          node -e 'const {startServer}=require("./test/helpers/e2e-app.cjs");startServer().then(({base})=>{require("fs").writeFileSync("/tmp/f123-preview-url",base);});' &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do test -s /tmp/f123-preview-url && break; sleep 0.2; done
          test -s /tmp/f123-preview-url
          BASE=$(cat /tmp/f123-preview-url)
          curl --fail --silent --show-error "$BASE/version.json" > /tmp/f123-preview-version.json
          node -e 'const v=require("/tmp/f123-preview-version.json");if(v.shell!=="f123-shell-v696")process.exit(1)'
          echo 'QA ONLY: synthetic license, candidate v696 served locally, no Owner PIN, no business writes by observer.'
          node scripts/qa-preview-union-fria.cjs "$BASE/" | tee -a "$GITHUB_STEP_SUMMARY"
