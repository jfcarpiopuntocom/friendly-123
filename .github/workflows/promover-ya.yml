name: promover-ya

# OVERRIDE DE JFC (2026-09-29): "pushea la version mas reciente y punto".
# Hace lo mismo que la orden PUSH del panel (sonar.yml): previo <- estable, estable <- master,
# SIN la ventana de 33 min y sin mirar el Sonar. Solo hacia adelante (estable debe ser ancestro
# de master). Se dispara al subir .github/promover-ya.json a la rama de trabajo de Claude, porque
# la integracion de GitHub de la nube no puede lanzar workflow_dispatch (403).
# Despues lanza publicar.yml sobre master: el entorno github-pages solo acepta despliegues de la
# rama por defecto, asi que no puede llamarse desde esta rama con workflow_call.
on:
  push:
    branches: [nube-skills-jev-a5f0km]
    paths: ['.github/promover-ya.json']

permissions:
  contents: write
  actions: write

concurrency:
  group: promover-ya
  cancel-in-progress: false

jobs:
  promover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mover ramas (previo <- estable, estable <- master)
        run: |
          set -euo pipefail
          git fetch -q origin estable master
          ESTABLE=$(git rev-parse origin/estable)
          MASTER=$(git rev-parse origin/master)
          echo "estable=$ESTABLE ($(git show origin/estable:docs/version.json | grep -o 'f123-shell-v[0-9]*'))"
          echo "master =$MASTER ($(git show origin/master:docs/version.json | grep -o 'f123-shell-v[0-9]*'))"
          if [ "$ESTABLE" = "$MASTER" ]; then echo "estable ya esta en master"; exit 0; fi
          if ! git merge-base --is-ancestor "$ESTABLE" "$MASTER"; then echo "estable no es ancestro de master: no se mueve"; exit 1; fi
          git push origin "$ESTABLE:refs/heads/previo" --force
          git push origin "$MASTER:refs/heads/estable" --force
          echo "previo=$ESTABLE estable=$MASTER"
      - name: Publicar (workflow publicar sobre master)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --ref master --repo "$GITHUB_REPOSITORY"
