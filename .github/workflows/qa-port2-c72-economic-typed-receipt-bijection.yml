name: PORT2 C72 effect <-> typed business receipt bijection (native SQLite and Workerd QA)
on:
  pull_request:
    paths:
      - 'cloudflare-yparty-worker/src/authoritative-business-sql.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c72-economic-effect-receipt-reconcile.test.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c68-economic-reopen-certified-effects.test.mjs'
      - '.github/workflows/qa-port2-c72-economic-typed-receipt-bijection.yml'
  push:
    branches:
      - 'port2/20261120-c72-economic-effect-receipts'
permissions:
  contents: read
jobs:
  economic-receipt-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix cloudflare-yparty-worker --no-audit --no-fund
      - name: C72 source + real typed ledger + native SQLite effect/receipt RED-GREEN
        run: node --test cloudflare-yparty-worker/qa/p0-c72-economic-effect-receipt-reconcile.test.mjs
      - name: C68 real SQLite original finance and stock readback regressions
        run: node --test cloudflare-yparty-worker/qa/p0-c68-economic-reopen-certified-effects.test.mjs
      - name: Original Workerd SQL partial payments and role security
        run: node --test cloudflare-yparty-worker/qa/p0-gate-a-typed-payment-sql.test.mjs
      - name: Original Workerd SQL sales, cash, exact opId receipts after restart
        run: node --test cloudflare-yparty-worker/qa/p0-gate-a-business-sql-workerd.test.mjs
      - name: Original 100.0 engineering metrics remain independent
        run: |
          node scripts/architecture-2-port-score.cjs --json
          node --test test/p0-architecture-2-port-score.test.cjs
