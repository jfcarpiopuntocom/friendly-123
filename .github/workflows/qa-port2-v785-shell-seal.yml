name: PORT LIVE shell seal · manifest, real bundle, fallback (no deploy)
on:
  pull_request:
    paths:
      - docs/sw.js
      - docs/version.json
      - docs/version-manifest.json
      - docs/vendor/yparty-piloto.min.js
      - docs/sync-yjs.js
      - .github/workflows/qa-port2-v785-shell-seal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked QA test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare published master, new shell, bundle digest and QA default OFF
        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto'),cp=require('node:child_process');
          const m=JSON.parse(fs.readFileSync('docs/version-manifest.json','utf8'));
          const v=JSON.parse(fs.readFileSync('docs/version.json','utf8'));
          const old=JSON.parse(cp.execFileSync('git',['show','origin/master:docs/version.json'],{encoding:'utf8'}));
          const num=s=>Number(String(s).match(/\d+$/)?.[0]);
          // Version is a canonical rendering of the shell integer.
          // Shell 799 = v0.7.99; shell 800 = v0.8.00, not v0.7.100.
          const versionFromShell=(shell)=>{
            const n=num(shell);
            assert.ok(Number.isSafeInteger(n)&&n>=0,'shell must be a nonnegative integer');
            return 'v0.'+Math.floor(n/100)+'.'+String(n%100).padStart(2,'0');
          };
          assert.match(v.version,/^v0\.\d+\.\d{2}$/);
          assert.equal(v.version,versionFromShell(v.shell),'new display version must exactly encode its shell');
          assert.equal(old.version,versionFromShell(old.shell),'base display version must exactly encode its shell');
          assert.match(v.shell,/^f123-shell-v\d+$/);
          assert.match(v.cacheGeneration,/^golden\d+$/);
          assert.equal(num(v.shell),num(old.shell)+1,'release shell/version must advance exactly once');
          assert.equal(num(v.shell),num(old.shell)+1,'shell identity must advance exactly once');
          assert.equal(num(v.cacheGeneration),num(old.cacheGeneration)+1,'cache generation must advance exactly once');
          assert.equal(m.version,v.version);assert.equal(m.shell,v.shell);
          const vendor=fs.readFileSync('docs/vendor/yparty-piloto.min.js');
          const sha=crypto.createHash('sha256').update(vendor).digest('hex');
          assert.equal(sha,'a45e716d95a880ca0338df1d78a433014e196813baa97294492ec846e455ccc2');
          assert.equal(m.files['./vendor/yparty-piloto.min.js'],'sha256-'+sha);
          const sw=fs.readFileSync('docs/sw.js','utf8');
          assert.ok(sw.includes('const CACHE = "'+v.shell+'";'),'SW must match exact released shell');
          assert.ok(sw.includes('const CACHE_GENERACION = "-'+v.cacheGeneration+'";'),'SW must match exact released generation');
          const rollout=JSON.parse(fs.readFileSync('docs/sync-rollout.json','utf8'));
          assert.ok(Object.values(rollout.licenses||{}).every(x=>x.yparty!==true),'cannot enable customer store in seal');
          assert.equal(v.requerida,false);
          assert.deepEqual(v.apagar,[]);
          console.log(v.version+' '+v.shell+' '+v.cacheGeneration+' > master; verified real bundle SHA256; all rollout gates OFF');
          JS
      - name: Rebuild official deterministic shell manifest, no differences
        run: |
          node scripts/gen-manifest.js
          git diff --exit-code -- docs/version-manifest.json docs/sw.js
          bash check-sw.sh
          git diff --check
      - name: Built bundle, switch and fallback synthetic source tests
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 \
            test/p0-yparty-client-built-bundle.test.cjs \
            test/p0-yparty-pilot-origin.test.cjs \
            test/p0-bridge-store-switch.test.cjs \
            test/p0-rollout-policy.test.cjs
