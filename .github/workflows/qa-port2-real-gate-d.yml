name: "PORT 2.0 · REAL app Gate D Workerd cold-history (QA only)"
on:
  push:
    branches: [port2/20261119-real-gate-d-onstart]
    paths:
      - cloudflare-yparty-worker/src/**
      - cloudflare-yparty-worker/qa/**
      - .github/workflows/qa-port2-real-gate-d.yml
  pull_request:
    branches: [master]
    paths:
      - cloudflare-yparty-worker/src/**
      - cloudflare-yparty-worker/qa/**
      - .github/workflows/qa-port2-real-gate-d.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-d-real-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install issuer and real YParty Workerd dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
      - name: REAL Tienda synthetic pre-cut, native SQL, cold reopen, OFF and privacy
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test --test-concurrency=1 qa/p0-gate-d-real-onstart-workerd.test.mjs qa/p0-frozen-import-workerd.test.mjs qa/p0-full-export-workerd.test.mjs qa/p0-certified-frozen-import.test.mjs 2>&1 | tee /tmp/f123-port2-real-gate-d.tap
