name: P0 strict durable-ACK exact-true gate
on:
  push:
    branches: [hotfix/v629-exact-durable-ack-20261030]
  pull_request:
    paths:
      - 'docs/mock-backend.js'
      - 'test/ab-transaction-recovery.test.cjs'
      - '.github/workflows/p0-strict-durable-ack.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact SHA256 and line counts
        run: |
          sha256sum docs/mock-backend.js test/ab-transaction-recovery.test.cjs
          wc -l docs/mock-backend.js test/ab-transaction-recovery.test.cjs
      - name: Strict CAS ACK must be literal true; reject all other truthy values
        run: node --test --test-name-pattern='full backend authorizes IDB fallback|full backend waits for the real IDB acknowledgement' test/ab-transaction-recovery.test.cjs
      - name: Adjacent durable stock PN and clock contracts
        run: node --test test/p0-durable-stock-adjustment.test.cjs test/stock-base-conflicto-v515.test.js test/incident-stale-stock-metadata-v558.test.js test/incident-stock-monotonic-clock-v559.test.js
