name: Render Codex friendly-123 reels
on:
  push:
    branches:
      - codex/reels-comparacion
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium
      - name: Render Reel A
        working-directory: video/codex-reel-A
        run: |
          npm ci
          node music/score.mjs
          ffmpeg -y -i music/score.wav -af "highpass=f=30,equalizer=f=250:t=q:w=1:g=-2,loudnorm=I=-14:TP=-1.2:LRA=8" -c:a aac -b:a 192k assets/score.m4a
          CHROME=$(command -v chromium-browser || command -v chromium || command -v google-chrome)
          node render.mjs --frames --workers=4 --soft-gl --chrome="$CHROME"
          node render.mjs --encode --audio=assets/score.m4a --out=out/full.mp4 --fps=30
          ffmpeg -y -i out/full.mp4 -vf "scale='min(1280,iw)':-2" -c:v libx264 -crf 24 -preset medium -c:a aac -b:a 128k codex-reel-A.mp4
          npm run sheet
      - name: Render Reel B
        working-directory: video/codex-reel-B
        run: |
          npm ci
          node music/score.mjs
          ffmpeg -y -i music/score.wav -af "highpass=f=30,equalizer=f=250:t=q:w=1:g=-2,loudnorm=I=-14:TP=-1.2:LRA=8" -c:a aac -b:a 192k assets/score.m4a
          CHROME=$(command -v chromium-browser || command -v chromium || command -v google-chrome)
          node render.mjs --frames --workers=4 --soft-gl --chrome="$CHROME"
          node render.mjs --encode --audio=assets/score.m4a --out=out/full.mp4 --fps=30
          ffmpeg -y -i out/full.mp4 -vf "scale='min(1280,iw)':-2" -c:v libx264 -crf 24 -preset medium -c:a aac -b:a 128k codex-reel-B.mp4
          npm run sheet
      - name: Upload reels
        uses: actions/upload-artifact@v4
        with:
          name: codex-friendly-reels
          path: |
            video/codex-reel-A/out/full.mp4
            video/codex-reel-A/codex-reel-A.mp4
            video/codex-reel-A/*sheet*.jpg
            video/codex-reel-B/out/full.mp4
            video/codex-reel-B/codex-reel-B.mp4
            video/codex-reel-B/*sheet*.jpg
          if-no-files-found: error
