name: C166 build and seal Commissions total-first (app plus dashboard)
on:
  push:
    branches:
      - fix/c166-commissions-total-first-app-dashboard
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c166-commissions-total-first-app-dashboard
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the original lockfile
        run: npm ci --no-audit --no-fund
      - name: RED-to-GREEN commission invariants on both real UIs
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test \
            test/p0-c166-commissions-total-first.test.cjs \
            test/p0-belen-commissions-all-dates.test.cjs \
            test/p0-c142-commission-conflict-local-day.test.cjs \
            test/p0-c149-commission-split-order-identity.test.cjs \
            test/p0-c151-single-payee-commission.test.cjs
      - name: Generate the official app and dashboard assets
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Seal exact generated assets on this candidate branch only
        run: |
          set -euo pipefail
          git config user.name "friendly-123 build seal"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(C166): seal both Commissions total-first UIs and v863 manifest"
            git push origin HEAD:refs/heads/fix/c166-commissions-total-first-app-dashboard
          fi
