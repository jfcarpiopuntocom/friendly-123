name: "PORT2 C12 · decimal scores and certified public reader"
on:
  push:
    branches: [port2/20261119-c12-score-reader]
  pull_request:
    branches: [master]
    paths:
      - docs/engineering/architecture-2-port-score.json
      - docs/engineering/architecture-2-quality-score.json
      - scripts/architecture-2-port-score.cjs
      - test/p0-architecture-2-port-score.test.cjs
      - src/ws-owner-ticket-params.mjs
      - src/port2-readonly-catalog-session.mjs
      - src/yparty-piloto.js
      - cloudflare-yparty-worker/qa/p0-c12-readonly-catalog-client.test.mjs
      - .github/workflows/qa-port2-real-c12-score-reader.yml
permissions: {contents: read}
jobs:
  c12:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reproducible /100 metrics source integrity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node scripts/architecture-2-port-score.cjs
          node --test test/p0-architecture-2-port-score.test.cjs
      - name: Setup exact Workerd Yjs deps
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Browser protocol source and C11 public cold proof
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 --test-timeout=90000 qa/p0-c12-readonly-catalog-client.test.mjs
