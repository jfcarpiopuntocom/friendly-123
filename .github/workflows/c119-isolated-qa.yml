# Isolated, no-release verification of C118 on the LATEST Claude v842 candidate.
# Never bypass or alter the official shell/manifest release gates.
name: C119 latest v842 integrated PN receipts QA
on:
  pull_request:
    paths:
      - 'docs/mock-backend.js'
      - 'docs/sync-realtime.js'
      - 'docs/sync-yjs.js'
      - 'test/p0-v842-*.test.cjs'
      - 'test/p0-c118-*.test.cjs'
      - '.github/workflows/c119-isolated-qa.yml'
permissions:
  contents: read
jobs:
  integrated:
    if: github.head_ref == 'qa/c119-v842-latest-c118-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full real OCSync, legacy bridge and local sale/stock regression
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=2 --test-timeout=120000 \
            test/p0-v842-concurrent-receipts-red.test.cjs \
            test/p0-v842-legacy-peer-receipt-barrier.test.cjs \
            test/p0-c118-remote-local-overlap.test.cjs \
            test/p0-stock-witness-durable-rollback.test.cjs \
            test/p0-jfc-stock-proof-pending.test.cjs \
            test/p0-durable-stock-adjustment.test.cjs \
            test/realtime-sale-ack-barrier.test.cjs \
            test/p0-s3-remote-movement-transient-retry.test.cjs \
            test/p0-same-tab-pin-sale-claim.test.cjs
