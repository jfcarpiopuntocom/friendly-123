name: "PORT 2.0 C87 · Hibernation ghost-socket batch isolation"
on:
  pull_request:
    branches: [master]
    paths:
      - cloudflare-yparty-worker/src/index.js
      - cloudflare-yparty-worker/qa/p0-c87-hibernation-ghost-socket-isolation.test.mjs
      - .github/workflows/qa-port2-c87-hibernation-ghost-socket.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  c87-ghost-socket-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Ghost-socket batch isolation and real Workerd separate-rooms security regressions
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test --test-concurrency=1 --test-timeout=90000 qa/p0-c87-hibernation-ghost-socket-isolation.test.mjs qa/p0-secure-separate-rooms.test.mjs qa/p0-real-session-room.test.mjs qa/p0-gate-d-real-onstart-workerd.test.mjs
