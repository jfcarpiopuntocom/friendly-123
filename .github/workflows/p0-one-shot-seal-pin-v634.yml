name: P0 one-shot seal JFC PIN shell v634
on:
  push:
    branches: [fix/p0-land-jfc-pin-v634-20261031]
    paths: [.github/workflows/p0-one-shot-seal-pin-v634.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Deterministic shell identity, no other runtime changes
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='docs/version.json',v=JSON.parse(fs.readFileSync(path,'utf8'));
          if(v.shell!=='f123-shell-v633'||v.cacheGeneration!=='golden180')throw Error('unexpected version baseline');
          v.version='shell v634';v.shell='f123-shell-v634';v.releaseName='shell v634';
          v.cacheGeneration='golden181';v.fecha='2026-10-31';
          v.changelog='JFC license/PIN authority: preserve existing clients, census registered devices before central activation, responsive PIN editor. Stock and sales unchanged.';
          fs.writeFileSync(path,JSON.stringify(v,null,2)+'\n');
          function edit(file,oldStr,newStr){
           let s=fs.readFileSync(file,'utf8');if(s.split(oldStr).length!==2)throw Error('identity anchor mismatch: '+file);
           fs.writeFileSync(file,s.replace(oldStr,newStr));
          }
          edit('docs/sw.js','const CACHE = "f123-shell-v633";','const CACHE = "f123-shell-v634";');
          edit('docs/sw.js','const CACHE_GENERACION = "-golden180";','const CACHE_GENERACION = "-golden181";');
          edit('docs/dashboard.html','<meta name="dashboard-shell" content="f123-shell-v633">','<meta name="dashboard-shell" content="f123-shell-v634">');
          edit('docs/dashboard.html','<meta name="dashboard-release" content="shell v633">','<meta name="dashboard-release" content="shell v634">');
          NODE
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate origin/master
          git diff --check
          git diff --stat
      - name: Commit exact sealed hashes to this candidate branch only
        run: |
          set -euo pipefail
          git config user.name "friendly-123 release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version.json docs/sw.js docs/dashboard.html docs/version-manifest.json
          git diff --cached --quiet && exit 1
          git commit -m "release(candidate): seal JFC PIN shell v634 golden181 and deterministic SHA256 manifest"
          git push origin HEAD:refs/heads/fix/p0-land-jfc-pin-v634-20261031
