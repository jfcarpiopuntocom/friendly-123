name: C146 Verified Sale Receipt Build and Seal
on:
  push:
    branches: [fix/c146-sale-ui-receipt-ack-v853]
    paths:
      - .github/workflows/qa-c146-sale-ack-autoseal.yml
      - src/app/app-inline-01.js
      - docs/version.json
      - docs/dashboard.html
      - docs/sw.js
      - test/p0-sale-ui-receipt-ack.test.cjs
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c146-sale-ui-receipt-ack-v853
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild exact app and dashboard assets
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Verify actual source-executed sale receipt flow and adjacent opId contracts
        run: |
          set -euo pipefail
          node --test test/p0-sale-ui-receipt-ack.test.cjs test/p0-sale-entry-opid-contract.test.cjs
      - name: Seal generated assets on the candidate branch only
        run: |
          set -euo pipefail
          git config user.name "friendly-123 release seal"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(C146): deterministic v853 app and manifest after verified receipt QA"
            git push origin HEAD:refs/heads/fix/c146-sale-ui-receipt-ack-v853
          fi
