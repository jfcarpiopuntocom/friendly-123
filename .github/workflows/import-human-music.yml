name: import-human-music

on:
  push:
    branches:
      - codex/human-music-import
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone public audio archive
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/noobsandnerdsgroup/audio/main/Airport%20Lounge.mp3' \
            -o out/Airport-Lounge-Kevin-MacLeod.mp3
          sha256sum out/Airport-Lounge-Kevin-MacLeod.mp3 | tee out/SHA256SUMS.txt
          cat > out/LICENSE-CREDIT.txt <<'EOF'
          Track: Airport Lounge
          Composer: Kevin MacLeod
          Official track page: https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1100806
          License: Creative Commons Attribution 4.0 International (CC BY 4.0)
          Commercial use: permitted with attribution.
          Required credit:
          "Airport Lounge" Kevin MacLeod (incompetech.com)
          Licensed under Creative Commons: By Attribution 4.0 License
          http://creativecommons.org/licenses/by/4.0/
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: airport-lounge-human-music
          path: out/
          if-no-files-found: error
