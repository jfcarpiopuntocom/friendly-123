name: import-human-music

on:
  push:
    branches:
      - codex/human-music-import
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download human-composed CC-BY track
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2             'https://ifarchive.ifreviews.org/if-archive/games/competition2020/Games/The%20Cursed%20Pickle%20of%20Shireton/files/Lobby%20Time.mp3'             -o out/Lobby-Time-Scott-Buckley.mp3
          sha256sum out/Lobby-Time-Scott-Buckley.mp3 | tee out/SHA256SUMS.txt
          cat > out/LICENSE-CREDIT.txt <<'EOF'
          Track: Lobby-Time
          Composer: Kevin MacLeod
          Source/license: https://www.incompetech.com/music/royalty-free/index.html?isrc=USUAN1600054
          License: Creative Commons Attribution 4.0 International (CC BY 4.0)
          Commercial use: permitted with attribution.
          Required credit:
          "Lobby Time" Kevin MacLeod (incompetech.com) Licensed under Creative Commons: By Attribution 4.0 License http://creativecommons.org/licenses/by/4.0/
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: human-music-simplicity
          path: out/
          if-no-files-found: error
