name: P0 Dashboard v789 deterministic manifest seal (branch only)
on:
  push:
    branches: [fix/p0-dashboard-broadcast-legacy-independent-20261118]
    paths:
      - docs/version.json
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-dashboard-broadcast-legacy-independent-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate manifest from actual published source bytes
        run: |
          set -euo pipefail
          node scripts/gen-manifest.js
      - name: Commit deterministic generated artifacts once
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/version-manifest.json docs/sw.js; then
            git config user.name "friendly-123 release seal"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/version-manifest.json docs/sw.js
            git commit -m "release(v789): seal exact shell hashes and offline assets"
            git push origin HEAD:fix/p0-dashboard-broadcast-legacy-independent-20261118
          fi
          bash check-sw.sh
