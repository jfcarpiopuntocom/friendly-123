name: v448-golden-yjs-lifecycle-red
on:
  push:
    branches:
      - "forensics/v448-golden-yjs-lifecycle-2026-10-03"
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node --require ./test/helpers/sin-red-produccion.cjs --test test/yjs-bridge.test.js
