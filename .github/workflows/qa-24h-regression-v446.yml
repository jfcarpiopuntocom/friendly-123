name: qa-24h-regression-v446

on:
  push:
    branches:
      - qa/24h-regression-gauntlet-v446
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full test suite
        run: npm test
      - name: Service worker integrity
        run: bash check-sw.sh
      - name: Diff hygiene
        run: |
          git fetch -q origin master
          git diff --check origin/master...HEAD
