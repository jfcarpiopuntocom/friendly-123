name: C205 one-shot reproducible generated assets
on:
  push:
    branches:
      - fix/c205-rellenar-huecos-relay
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'jfcarpiopuntocom/friendly-123'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c205-rellenar-huecos-relay
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild and validate generated assets on exact branch
        run: |
          set -euo pipefail
          npm ci
          node scripts/build-min-scripts.cjs
          node scripts/build-min-scripts.cjs --check
          node scripts/gen-manifest.js
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node --test test/c205-rellenar-huecos.test.cjs
          bash check-sw.sh
          git diff --check
      - name: Commit generated assets and retire this one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/c205-build-once.yml
          git add docs/sync-yjs.min.js docs/version-manifest.json
          git diff --cached --check
          git commit -m "build(C205): regenerate exact Sync3 minified runtime and integrity manifest"
          git push origin HEAD:fix/c205-rellenar-huecos-relay
