name: PORT2 C44 · real Workerd SQLite ajuste + abono E2E
on:
  push:
    branches: [port2/20261119-c44-ajuste-abono-cutover-v819]
  pull_request:
    branches: [master]
    paths:
      - docs/sync-realtime.js
      - docs/sync-yjs.js
      - cloudflare-yparty-worker/qa/p0-c44-ajuste-abono-workerd.test.mjs
      - .github/workflows/qa-port2-real-c44-ajuste-abono-workerd.yml
permissions: {contents: read}
jobs:
  c44-ajuste-abono-workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 --test-timeout=120000 \
            qa/p0-c44-ajuste-abono-workerd.test.mjs
          cd ..
          bash check-sw.sh
