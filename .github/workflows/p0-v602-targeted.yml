name: p0-v602-targeted-regressions
on:
  push:
    branches:
      - fix/p0-v602-stock-convergence-forensic
  pull_request:
    branches: [master]
    paths:
      - docs/sync-yjs.js
      - docs/auth-ui.js
      - test/incident-v602-*.cjs
jobs:
  forensic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and two focused incident guards
        run: |
          node --check docs/sync-yjs.js
          node --check docs/auth-ui.js
          node test/incident-v602-relay-null-stock-epoch.test.cjs
          node test/incident-v602-pin-identity-guard.test.cjs
      - name: Stock conflict and old metadata regressions
        run: |
          node --test test/stock-base-conflicto-v515.test.js test/incident-stale-stock-metadata-v558.test.js
