name: PORT2 C66 certified Yjs vector continuity (real SQLite + Workerd QA)
on:
  pull_request:
    paths:
      - 'cloudflare-yparty-worker/src/certified-frozen-import.mjs'
      - 'cloudflare-yparty-worker/src/frozen-vector-baseline.mjs'
      - 'cloudflare-yparty-worker/src/open-existing-store.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c66-frozen-vector-cold-reopen.test.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c64-frozen-base-readback.test.mjs'
      - '.github/workflows/qa-port2-c66-frozen-vector-continuity.yml'
  push:
    branches:
      - 'port2/20261120-c66-frozen-vector-causal-fence'
permissions:
  contents: read
jobs:
  certified-vector-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix cloudflare-yparty-worker --no-audit --no-fund
      - name: Real original imported Yjs and native SQLite C66 causal regression
        run: node --test cloudflare-yparty-worker/qa/p0-c66-frozen-vector-cold-reopen.test.mjs
      - name: Frozen import SQLite durable source tests
        run: node --test cloudflare-yparty-worker/qa/p0-certified-frozen-import.test.mjs
      - name: C64 frozen SQL base previous regression
        run: node --test cloudflare-yparty-worker/qa/p0-c64-frozen-base-readback.test.mjs
      - name: Actual Tienda Workerd YParty cold-join continuity
        run: node --test cloudflare-yparty-worker/qa/p0-gate-d-real-onstart-workerd.test.mjs
      - name: Original 100.0 engineering scores and GO remain separate
        run: |
          node scripts/architecture-2-port-score.cjs --json
          node --test test/p0-architecture-2-port-score.test.cjs
