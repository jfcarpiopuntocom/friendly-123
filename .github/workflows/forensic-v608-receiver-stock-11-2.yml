name: forensic P0 stock 11 versus 2 (isolated)
on:
  push:
    branches: [forensic/v608-receiver-stock-11-2-20261028]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  exact-repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies (no scripts, no customer data)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check actual production bridge
        run: node --check docs/sync-yjs.js
      - name: Only isolated P0 receiver regression (no external network, no customer data)
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/incident-v608-publication-after-recovery.test.cjs
      - name: Four existing focused PN and Yjs regression files (no broad suite)
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test \
            test/stock-base-conflicto-v515.test.js \
            test/yjs-idle-write-budget.test.js \
            test/v579-venta-pn-ack.test.js \
            test/incident-v604-selective-apply-retry.test.cjs
