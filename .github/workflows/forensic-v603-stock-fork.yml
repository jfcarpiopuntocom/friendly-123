name: forensic-v603-stock-fork
on:
  push:
    branches: [forensic/v603-convergence-startup-perf]
  workflow_dispatch: {}
jobs:
  preserve-stock-facts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One P0 regression, no customer data or production network
        run: |
          node --test --test-name-pattern="P0 v603: diverging physical bases" test/stock-base-conflicto-v515.test.js
  profile-noop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two synthetic notebook profiles, no business data
        run: node test/forensic-v603-seed-cost.cjs
      - name: One 1000-product remote edit with actual Yjs bridge
        run: node test/forensic-v603-merge-cost.cjs
