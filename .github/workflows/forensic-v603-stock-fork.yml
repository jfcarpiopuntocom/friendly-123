name: forensic-v603-stock-fork
on:
  push:
    branches: [forensic/v603-convergence-startup-perf]
  workflow_dispatch: {}
jobs:
  preserve-stock-facts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One P0 regression, no customer data or production network
        run: |
          node --check docs/sync-yjs.js
          node --check docs/mock-backend.js
          node --test test/stock-base-conflicto-v515.test.js
  profile-noop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two synthetic notebook profiles, no business data
        run: node test/forensic-v603-seed-cost.cjs
      - name: One 1000-product remote edit with actual Yjs bridge
        run: node test/forensic-v603-merge-cost.cjs
  regression-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Small first-join, money, PN, PIN and idle sync regressions
        run: |
          node --check docs/app-inline-03.min.js
          node --check src/app/app-inline-03.js
          node --test test/incident-v604-no-auto-reload-pending-yjs.test.cjs test/e2-active-user-reload.test.js test/incident-v604-selective-apply-retry.test.cjs test/incident-v604-login-reload-guard.test.cjs test/pr439-update-notice.test.cjs
          node --test test/incident-first-sync-integrity-v558.test.js test/incident-stale-stock-metadata-v558.test.js test/v579-venta-pn-ack.test.js test/yjs-pin-seed.test.js test/yjs-idle-write-budget.test.js test/peer-initial-recovery.test.cjs
