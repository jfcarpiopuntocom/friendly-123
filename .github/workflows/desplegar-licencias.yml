name: Deploy friendly123 license Worker

# Manual by default; one approved, exact-SHA rollout after verified v634 via a guarded push.
on:
  push:
    branches: [master]
    paths: [".github/workflows/desplegar-licencias.yml"]
  workflow_dispatch:
    inputs:
      worker_name:
        description: Type friendly123-licencias to confirm the target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: friendly123-licencias-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && inputs.worker_name == 'friendly123-licencias') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'APPROVED-SINGLE-PIN-DEPLOY-20261031'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enforce exactly the tested v634 PIN authority on automatic rollout
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$(node -p "require('./docs/version.json').shell")" = 'f123-shell-v635'
          test "$(git rev-parse HEAD:cloudflare-worker/pin-authority.mjs)" = '758e2f95f2bc1b64b832c74383fd29d90dfd6c62'
          node --check cloudflare-worker/worker.js
          node --check cloudflare-worker/pin-worker-api.mjs
          echo 'PIN authority version and blob pinned: deployment cannot affect another shell.'
      - name: Check Worker, old license registry and new PIN authority (synthetic only)
        run: |
          node --test --test-timeout=120000 test/panel-durable-object.test.js test/worker-checkin.test.js test/p0-central-pin-authority.test.mjs test/p0-central-pin-worker-entry.test.mjs test/p0-central-pin-legacy-offline-guard.test.cjs
      - name: Verify exact Worker and bindings
        working-directory: cloudflare-worker
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(sed -n 's/^name = "\(.*\)"/\1/p' wrangler.toml | head -1)" = 'friendly123-licencias'
          ../node_modules/.bin/wrangler deploy --config ./wrangler.toml --dry-run > "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.LICENCIAS' "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.REGISTROS' "$RUNNER_TEMP/license-dry-run.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Wrangler [secrets].required verifies existing MASTER_KEY and PIN_PEPPER
      # before deploy; never create, print, rotate or replace either secret.
      # Existing clients and their licenses remain intact if secrets unavailable.
      - name: Deploy license Worker
        working-directory: cloudflare-worker
        run: ../node_modules/.bin/wrangler deploy --config ./wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
