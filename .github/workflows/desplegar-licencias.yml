name: Deploy friendly123 license Worker

# Manual-only deployment via workflow_dispatch with exact target confirmation.
# PRs touching cloudflare-worker/ or this workflow execute the secret-free verify gate only.
on:
  pull_request:
    branches: [master]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/desplegar-licencias.yml"
      - "test/p0-license-deploy-gate.test.cjs"
      - "test/p0-ws-*.test.mjs"
      - "test/p0-central-pin-*.test.*"
      - "test/panel-durable-object.test.js"
      - "test/worker-*.test.js"
  workflow_dispatch:
    inputs:
      worker_name:
        description: Type friendly123-licencias to confirm the target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: friendly123-licencias-deploy-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax-check all license, PIN, team and /ws/ticket Worker modules
        run: |
          set -euo pipefail
          node --check cloudflare-worker/worker.js
          node --check cloudflare-worker/pin-authority.mjs
          node --check cloudflare-worker/pin-worker-api.mjs
          node --check cloudflare-worker/team-authority.mjs
          node --check cloudflare-worker/team-worker-api.mjs
          node --check cloudflare-worker/ws-authorized-subject.mjs
          node --check cloudflare-worker/ws-capability-issuer.mjs
          node --check cloudflare-worker/ws-worker-api.mjs
      - name: Check Worker, license registry, PIN authority and /ws/ticket issuer (synthetic only)
        run: |
          node --test --test-timeout=120000 \
            test/p0-license-deploy-gate.test.cjs \
            test/panel-durable-object.test.js \
            test/worker-checkin.test.js \
            test/worker-licencia-pagada.test.js \
            test/worker-lotes-pagos.test.js \
            test/worker-master-recovery.test.js \
            test/worker-recover-pin.test.js \
            test/worker-sonar.test.js \
            test/worker-soporte-jfc.test.js \
            test/p0-central-pin-authority.test.mjs \
            test/p0-central-pin-worker-entry.test.mjs \
            test/p0-central-pin-legacy-offline-guard.test.cjs \
            test/p0-ws-authorized-subject.test.mjs \
            test/p0-ws-capability-issuer.test.mjs \
            test/p0-ws-worker-api.test.mjs
      - name: Dry-run package and verify exact Worker name, KV ID and all 4 bindings
        working-directory: cloudflare-worker
        run: |
          set -euo pipefail
          test "$(sed -n 's/^name = "\(.*\)"/\1/p' wrangler.toml | head -1)" = 'friendly123-licencias'
          ../node_modules/.bin/wrangler deploy --config ./wrangler.toml --dry-run > "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.LICENCIAS (f1599c69c4174cc2b38dd125c18ee3df)' "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.REGISTROS' "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.MAESTRO_IP' "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.MAESTRO_INST' "$RUNNER_TEMP/license-dry-run.txt"

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.worker_name == 'friendly123-licencias'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare credentials and target bindings before live deploy
        working-directory: cloudflare-worker
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets for the real friendly123 license Worker account."
            exit 1
          fi
          test "$(sed -n 's/^name = "\(.*\)"/\1/p' wrangler.toml | head -1)" = 'friendly123-licencias'
          ../node_modules/.bin/wrangler deploy --config ./wrangler.toml --dry-run > "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.LICENCIAS (f1599c69c4174cc2b38dd125c18ee3df)' "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.REGISTROS' "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.MAESTRO_IP' "$RUNNER_TEMP/license-dry-run.txt"
          grep -q 'env.MAESTRO_INST' "$RUNNER_TEMP/license-dry-run.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Wrangler [secrets].required verifies existing MASTER_KEY and PIN_PEPPER
      # before deploy; never create, print, rotate or replace either secret.
      # Existing clients and their licenses remain intact if secrets unavailable.
      - name: Deploy license Worker
        working-directory: cloudflare-worker
        run: ../node_modules/.bin/wrangler deploy --config ./wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
