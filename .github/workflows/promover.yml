# promover.yml — VENTANA DE 33 MINUTOS (regla dura de JFC, 2026-09-25).
# "33 minutos maximo, es el tiempo que me doy para testear desde cada commit/push tuyo".
# Cada push a master que toque docs/ ya esta en /next/ (publicar.yml). Aqui se espera
# 33 min mirando el Sonar del Worker cada minuto:
#   - rojo en el canario de ese shell (errores, scripts caidos, mezcla, descuadre) -> NO se promueve;
#   - JFC apreto "Detener" en su panel                                            -> NO se promueve;
#   - si no, a los 33 min: previo <- estable, estable <- este commit, y se publica.
# Un push nuevo cancela la espera anterior y reinicia la ventana (concurrency).
# Nada aqui toca datos: solo mueve que version de la interfaz ven los clientes.
name: promover

on:
  push:
    branches: [master]
    paths: ["docs/**"]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: promover
  cancel-in-progress: true

jobs:
  ventana:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      promover: ${{ steps.v.outputs.promover }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Esperar 33 min mirando el Sonar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          WORKER="https://friendly123-licencias.jfcarpio.workers.dev"
          SHELL_NUEVO=$(grep -o 'f123-shell-v[0-9]*' docs/version.json)
          echo "shell en /next/: $SHELL_NUEVO"
          # JFC 2026-09-30: el PUSH del panel lo ejecutaba solo sonar.yml, cuyo cron "cada 5 min"
          # GitHub lo corre cada 4-7 h: el panel decia "hecho" y los clientes seguian esperando.
          # Si durante esta ventana llega una orden PUSH reciente (<24 h, no ejecutada), se
          # promueve YA y se marca la orden como ejecutada (tag sonar-ID) para que sonar no la repita.
          ORDEN_ID=""
          pushPedido() {
            J=$(curl -s --max-time 20 "$WORKER/canario/orden" || echo '{}')
            ID=$(echo "$J" | jq -r '.orden.id // empty'); AC=$(echo "$J" | jq -r '.orden.accion // empty'); AT=$(echo "$J" | jq -r '.orden.at // 0')
            [ "$AC" = "push" ] || return 1
            echo "$ID" | grep -Eq '^[a-z0-9]{4,20}$' || return 1
            [ $(( $(date +%s) * 1000 - AT )) -le 86400000 ] || return 1
            git fetch -q --tags origin || true
            git rev-parse -q --verify "refs/tags/sonar-$ID" >/dev/null && return 1
            ORDEN_ID="$ID"; return 0
          }
          revisar() {
            E=$(curl -s --max-time 20 "$WORKER/canario/estado?shell=$SHELL_NUEVO" || echo '{}')
            if echo "$E" | jq -e '.rojo == true' >/dev/null 2>&1; then echo "ROJO: $(echo "$E" | jq -c '.rojos')"; return 1; fi
            if echo "$E" | jq -e '.detenido == true' >/dev/null 2>&1; then echo "DETENIDO por JFC"; return 1; fi
            return 0
          }
          # v448 post-incidente: silencio NO es verde y evidencia vieja tampoco.
          # Un canario util debe ser un aparato real de la licencia lord, reportando
          # desde /next/ y con telemetria reciente. El latido lord corre cada 3 min;
          # damos 7 min para tolerar jitter/red sin aceptar un testigo abandonado.
          # Solo promocion automatica; PUSH es la orden de emergencia de JFC.
          hayTestigo() {
            E=$(curl -s --max-time 20 "$WORKER/canario/estado?shell=$SHELL_NUEVO" || echo '{}')
            REP=$(echo "$E" | jq -r '.reportes // 0')
            APA=$(echo "$E" | jq -r '.aparatos // 0')
            ULT=$(echo "$E" | jq -r '.ultimo // 0')
            NEXT=$(echo "$E" | jq -r '.canales.next // 0')
            AHORA=$(( $(date +%s) * 1000 ))
            EDAD_ULT=$(( AHORA - ULT ))
            EDAD_NEXT=$(( AHORA - NEXT ))
            echo "testigo Sonar: reportes=$REP aparatos=$APA ultimo=${EDAD_ULT}ms next=${EDAD_NEXT}ms"
            [ "$REP" -ge 1 ] 2>/dev/null &&
            [ "$APA" -ge 1 ] 2>/dev/null &&
            [ "$ULT" -gt 0 ] 2>/dev/null &&
            [ "$NEXT" -gt 0 ] 2>/dev/null &&
            [ "$EDAD_ULT" -ge 0 ] 2>/dev/null &&
            [ "$EDAD_NEXT" -ge 0 ] 2>/dev/null &&
            [ "$EDAD_ULT" -le 420000 ] 2>/dev/null &&
            [ "$EDAD_NEXT" -le 420000 ] 2>/dev/null
          }
          # Tiempo desde el push, no desde el final de QA ni desde el inicio del runner.
          INICIO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) || exit 1
          FIN=$(( $(date -d "$INICIO" +%s) + 33 * 60 ))
          while [ "$(date +%s)" -lt "$FIN" ]; do
            if pushPedido; then
              echo "PUSH de emergencia de JFC ($ORDEN_ID): sin bloqueo QA/testigo"
              echo "orden=$ORDEN_ID" >> "$GITHUB_OUTPUT"; echo "promover=si" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if ! revisar; then echo "promover=no" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 60
          done
          if ! revisar; then echo "promover=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! hayTestigo; then echo "SIN TESTIGO CANARIO: no se promueve" >&2; echo "promover=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "promover=si" >> "$GITHUB_OUTPUT"
      - name: Mover ramas (previo <- estable, estable <- este commit)
        if: steps.v.outputs.promover == 'si'
        run: |
          set -euo pipefail
          TARGET="$GITHUB_SHA"
          if [ -n "$ORDEN_ID" ]; then
            TARGET=$(node scripts/release-control.cjs served "$GITHUB_SHA")
            node scripts/release-control.cjs gate "$TARGET" >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "PUSH explicito: QA no bloquea" >> "$GITHUB_STEP_SUMMARY"
          else
            # Una sola lectura al terminar la ventana: no extenderla esperando QA.
            node scripts/release-control.cjs gate "$GITHUB_SHA"
          fi
          git fetch -q origin estable master previo
          [ "$(git rev-parse origin/master)" = "$GITHUB_SHA" ] || { echo "Candidato obsoleto"; exit 1; }
          ESTABLE=$(git rev-parse origin/estable)
          if [ "$ESTABLE" = "$TARGET" ]; then echo "estable ya esta en este commit"; exit 0; fi
          # Solo hacia adelante: una ventana vieja jamas retrocede a los clientes.
          if ! git merge-base --is-ancestor "$ESTABLE" "$TARGET"; then echo "estable no es ancestro de este commit: no se mueve"; exit 1; fi
          git push --atomic origin "$ESTABLE:refs/heads/previo" "$TARGET:refs/heads/estable"
          echo "previo=$ESTABLE estable=$TARGET"
        env:
          GH_TOKEN: ${{ github.token }}
          ORDEN_ID: ${{ steps.v.outputs.orden }}
      - name: Marcar la orden PUSH como ejecutada
        if: steps.v.outputs.promover == 'si' && steps.v.outputs.orden != ''
        run: |
          git tag "sonar-${{ steps.v.outputs.orden }}" && git push -q origin "refs/tags/sonar-${{ steps.v.outputs.orden }}" || true

  publicar:
    needs: ventana
    if: needs.ventana.outputs.promover == 'si'
    uses: ./.github/workflows/publicar.yml
