name: P0 durable manual stock adjustments
on:
  pull_request:
    paths:
      - 'docs/mock-backend.js'
      - 'test/p0-durable-stock-adjustment.test.cjs'
      - '.github/workflows/p0-durable-stock-adjustment.yml'
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused durability, two-peer inventory, stale-metadata contracts
        run: |
          node --test test/p0-durable-stock-adjustment.test.cjs test/stock-base-conflicto-v515.test.js test/incident-stale-stock-metadata-v558.test.js test/incident-stock-monotonic-clock-v559.test.js
