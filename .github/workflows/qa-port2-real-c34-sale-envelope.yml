name: PORT2 C34 real sale envelope to typed C31
on:
  pull_request:
    paths:
      - 'docs/mock-backend.js'
      - 'docs/sync-yjs.js'
      - 'test/p0-c34-real-sale-envelope-contract.test.cjs'
      - '.github/workflows/qa-port2-real-c34-sale-envelope.yml'
  workflow_dispatch:
jobs:
  exact-product-sale-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run actual source contract with C31
        run: node --test test/p0-c34-real-sale-envelope-contract.test.cjs
      - name: Official manifest generation and sealed SHA proof (read-only CI workspace)
        run: |
          node scripts/gen-manifest.js
          node -e 'const x=require("./docs/version-manifest.json");console.log("C34_MANIFEST_HASHES "+JSON.stringify({version:x.version,shell:x.shell,mock:x.files["./mock-backend.js"],dashboard:x.files["./dashboard.html"]}))'
      - name: Revalidate fixed architectural tracking
        run: node scripts/architecture-2-port-score.cjs --json
