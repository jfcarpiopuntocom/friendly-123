name: qa-v449-photo-evidence-backup

on:
  push:
    branches: [hotfix/v449-photo-evidence-backup]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Focused v449 regressions
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/shelf-photo-durability-v449.test.js test/photo-backup-evidence-v449.test.js
      - name: Full suite
        run: npm test
      - name: Deterministic manifest
        run: |
          cp docs/version-manifest.json /tmp/version-manifest.before.json
          node scripts/generate-version-manifest.cjs
          diff -u /tmp/version-manifest.before.json docs/version-manifest.json
      - name: Shell integrity
        run: bash check-sw.sh
      - name: Diff hygiene
        run: |
          git fetch -q origin master
          git diff --check origin/master...HEAD
