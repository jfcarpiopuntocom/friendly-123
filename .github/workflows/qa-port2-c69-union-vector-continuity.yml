name: PORT2 C69 certified union Yjs vector continuity (real SQLite + Workerd QA)
on:
  pull_request:
    paths:
      - 'cloudflare-yparty-worker/src/merge-frozen-into-existing.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c69-union-vector-cold-reopen.test.mjs'
      - 'cloudflare-yparty-worker/qa/p0-gated4-merge-nonempty-sql.test.mjs'
      - 'cloudflare-yparty-worker/qa/p0-gated5-merge-pitr-budget-sql.test.mjs'
      - '.github/workflows/qa-port2-c69-union-vector-continuity.yml'
  push:
    branches:
      - 'port2/20261120-c69-union-vector-cold-reopen'
permissions:
  contents: read
jobs:
  certified-union-vector-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix cloudflare-yparty-worker --no-audit --no-fund
      - name: Real occupied-union Yjs and native SQLite C69 causal regression
        run: node --test cloudflare-yparty-worker/qa/p0-c69-union-vector-cold-reopen.test.mjs
      - name: Gate D4 nonempty union native SQLite and Workerd regression
        run: |
          node --test cloudflare-yparty-worker/qa/p0-gated4-merge-nonempty-sql.test.mjs
          node --test cloudflare-yparty-worker/qa/p0-gated5-merge-pitr-budget-sql.test.mjs
          node --test cloudflare-yparty-worker/qa/p0-gated4-real-onstart-workerd.test.mjs
      - name: C66 vector continuity and Gate D Workerd cold-open sanity
        run: |
          node --test cloudflare-yparty-worker/qa/p0-c66-frozen-vector-cold-reopen.test.mjs
          node --test cloudflare-yparty-worker/qa/p0-gate-d-real-onstart-workerd.test.mjs
      - name: Original 100.0 engineering scores and GO remain untouched
        run: |
          node scripts/architecture-2-port-score.cjs --json
          node --test test/p0-architecture-2-port-score.test.cjs
