name: P0 IDB no-op completion regression (one-shot)
on:
  push:
    branches: [fix/p0-legacy-worker-pin-route-404-20261031]
    paths: ['.github/workflows/p0-idb-noop-completion-once.yml']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify cancellation and durable ordering using actual IDB module
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/incident-idb-payout-name-photo-race-4d-v2.test.cjs
      - name: Verify durable rejection and recovery plus code syntax without external traffic
        run: |
          node --check docs/mock-backend.js
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 test/p0-failed-save-publication-gate.test.cjs
          git diff --check
