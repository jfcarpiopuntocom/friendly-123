name: P0 Belén v799 one-shot frozen history official seal
on:
  push:
    branches: [integrate/p0-belen-precut-history-v799-20261118]
    paths:
      - .github/workflows/p0-v799-official-seal-once.yml
permissions: {contents: write}
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 'Proof of 95 encrypted independent writer events and adjacent immutable regressions'
        run: |
          set -euo pipefail
          node --check docs/sync-yjs.js
          node --test --test-concurrency=1 --test-timeout=95000 \
            test/p0-precut-independent-writers-v783.test.cjs \
            test/incident-yjs-causal-replay-v559.test.js \
            test/incident-yjs-receive-queue-v558.test.js \
            test/p0-yjs-pending-snapshot.test.js \
            test/sync3-head-causal-gap.test.cjs \
            test/pull-cursor-durable-ack.test.cjs \
            test/firebase-relay-timestamp-boundary.test.cjs
      - name: 'Official v799 shell and deterministic manifest, no deploy'
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node - <<'NODE'
          const fs=require('node:fs');
          const get=p=>fs.readFileSync(p,'utf8');
          const put=(p,s)=>fs.writeFileSync(p,s);
          const v=JSON.parse(get('docs/version.json'));
          if(v.version!=='v0.7.98'||v.releaseName!=='v0.7.98'||v.shell!=='f123-shell-v798'||v.cacheGeneration!=='golden334')throw Error('unexpected v798 source');
          v.version='v0.7.99';v.releaseName='v0.7.99';v.shell='f123-shell-v799';v.cacheGeneration='golden335';v.fecha='2026-11-18';
          v.changelog='v0.7.99: la unión en frío recupera el historial cifrado anterior a un checkpoint de escritores independientes antes de dar el cuaderno por actualizado. Conserva todos los movimientos, cursores durables, PIN y los límites de reintentos. Sin ajustar existencias ni borrar datos.';
          put('docs/version.json',JSON.stringify(v,null,2)+'\n');
          let sw=get('docs/sw.js');
          for(const [a,b] of [['const CACHE = "f123-shell-v798"','const CACHE = "f123-shell-v799"'],['const CACHE_GENERACION = "-golden334"','const CACHE_GENERACION = "-golden335"']]){
            if(sw.split(a).length!==2)throw Error('unexpected SW identity '+a);
            sw=sw.replace(a,b);
          }
          put('docs/sw.js',sw);
          let dash=get('docs/dashboard.html');
          for(const [a,b] of [
            ['name="dashboard-shell" content="f123-shell-v798"','name="dashboard-shell" content="f123-shell-v799"'],
            ['name="dashboard-release" content="v0.7.98"','name="dashboard-release" content="v0.7.99"'],
            ['Dashboard v0.7.98','Dashboard v0.7.99']
          ]){if(dash.split(a).length!==2)throw Error('unexpected dashboard identity '+a);dash=dash.replace(a,b)}
          put('docs/dashboard.html',dash);
          NODE
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate 81c833209dd0ac6738ab0cc7e3fb2de34ac2d95e
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/version.json docs/dashboard.html docs/sw.js docs/version-manifest.json
          git diff --cached --quiet && { echo 'Expected signed v799 release changes'; exit 1; }
          git commit -m 'release(P0 Belen): frozen independent-writer coldjoin v799 golden335'
          git push origin HEAD:refs/heads/integrate/p0-belen-precut-history-v799-20261118
