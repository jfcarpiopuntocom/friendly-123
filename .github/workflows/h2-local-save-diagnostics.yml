name: H2 local-save timing diagnostics (read-only)
on:
  pull_request:
    paths:
      - scripts/h2-perf-local-summary.cjs
      - test/h2-perf-local-summary.test.cjs
      - test/guards/H2-LOCAL-SAVE-PHYSICAL-PROTOCOL.md
      - .github/workflows/h2-local-save-diagnostics.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  h2-contract:
    name: H2 privacy-safe aggregator contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify H2 analytics and reject sensitive fields
        run: node --test test/h2-perf-local-summary.test.cjs
      - name: Verify no production JS touched by H2
        run: |
          git diff --check
