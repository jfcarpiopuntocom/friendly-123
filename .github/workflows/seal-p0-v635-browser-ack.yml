name: Seal P0 v635 browser durability candidate (isolated)
on:
  push:
    branches: [fix/p0-active-notebook-transport-gate-20261031]
    paths:
      - .github/workflows/seal-p0-v635-browser-ack.yml
      - docs/version.json
      - docs/dashboard.html
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: seal-p0-v635-browser-ack
  cancel-in-progress: false
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute and prove candidate identity (never deploy)
        run: |
          set -euo pipefail
          node -e "const v=require('./docs/version.json');if(v.shell!=='f123-shell-v635'||v.cacheGeneration!=='golden181')process.exit(1)"
          node scripts/gen-manifest.js
          bash check-sw.sh
          node scripts/release-control.cjs validate "${{ github.event.before || 'HEAD^' }}"
          git diff --check
          wc -l docs/peer-sync.js docs/sync-realtime.js docs/sw.js docs/dashboard.html docs/version-manifest.json
          sha256sum docs/peer-sync.js docs/sync-realtime.js docs/sw.js docs/dashboard.html docs/version-manifest.json
      - name: Commit generated exact hashes to isolated branch only
        run: |
          set -euo pipefail
          git add docs/sw.js docs/version-manifest.json
          if git diff --cached --quiet; then echo 'Already sealed'; else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release(v635): seal exact multi-browser durability candidate hashes'
            git push origin HEAD:fix/p0-active-notebook-transport-gate-20261031
          fi
      - run: git rev-parse HEAD
