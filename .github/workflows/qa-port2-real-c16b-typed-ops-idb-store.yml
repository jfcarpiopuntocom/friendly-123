name: "PORT2 C16b-store · durable IndexedDB store for typed -ops reconciler"
on:
  pull_request:
    branches: [master]
    paths:
      - src/port2-typed-ops-idb-store.mjs
      - src/port2-typed-ops-reconciler.mjs
      - test/p0-c16b-typed-ops-idb-store.test.cjs
      - .github/workflows/qa-port2-real-c16b-typed-ops-idb-store.yml
permissions: {contents: read}
jobs:
  c16b-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify C16b-store syntax and real fake-indexeddb + C16a reconciler integration
        env:
          CI: "true"
        run: |
          set -euo pipefail
          node --check src/port2-typed-ops-idb-store.mjs
          node --test --test-timeout=60000 test/p0-c16b-typed-ops-idb-store.test.cjs test/p0-c16a-typed-ops-reconciler.test.cjs
