# One-shot, branch-only P0 canary. No customer, product, or relay writes.
# Intentionally removed from the branch after evidence is collected.
name: P0 629 preview cold-join synthetic read-only
on:
  push:
    branches:
      - qa/p0-ckpt-cross-layer-proof-v692
permissions:
  contents: read
concurrency:
  group: p0-629-preview-coldjoin
  cancel-in-progress: false
jobs:
  preview-coldjoin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify preview candidate (not main production)
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://qa-p0-ckpt-cross-layer-proof-v692-friendly-123.jfcarpio.workers.dev
          curl --fail --silent --show-error --location --max-time 30 "$BASE/sync-yjs.js" |
            grep -q 'checkpointLayer'
          curl --fail --silent --show-error --location --max-time 30 "$BASE/relay-selector.js" |
            grep -q 'persistLayer'
          echo "PREVIEW_CANDIDATE_PROVEN: true"
      - name: Cold join existing SYNTHETIC shop only (strict fail-closed)
        shell: bash
        env:
          F123_CANARIO_LICENCIA: ${{ secrets.F123_CANARIO_LICENCIA }}
          F123_CANARIO_PIN: ${{ secrets.F123_CANARIO_PIN }}
        run: |
          set -euo pipefail
          node scripts/canario-union-fria.cjs https://qa-p0-ckpt-cross-layer-proof-v692-friendly-123.jfcarpio.workers.dev/ |
            tee -a "$GITHUB_STEP_SUMMARY"
