name: PORT2 C84 strict R2 manifest required protects real frozen HEAD boundary
on:
  pull_request:
    paths:
      - 'cloudflare-yparty-worker/src/trusted-frozen-source.mjs'
      - 'cloudflare-yparty-worker/qa/p0-c84-strict-r2-pinned-manifest.test.mjs'
      - '.github/workflows/qa-port2-c84-strict-r2-manifest.yml'
  push:
    branches:
      - 'port2/20261120-c84-strict-r2-manifest-required'
permissions:
  contents: read
jobs:
  strict-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix cloudflare-yparty-worker --no-audit --no-fund
      - name: C84 strict manifest opt-in versus legacy self-attested frozen HEAD REAL Yjs RED GREEN
        run: node --test cloudflare-yparty-worker/qa/p0-c84-strict-r2-pinned-manifest.test.mjs
      - name: Existing D2 trusted paged source and legacy browser-compatible cases
        run: node --test cloudflare-yparty-worker/qa/p0-gate-d-trusted-paged-source.test.mjs
      - name: D6 signed R2 source actual Workerd with immutable off-bucket SHA pins
        run: node --test cloudflare-yparty-worker/qa/p0-gated6-frozen-r2-source-workerd.test.mjs
      - name: D7 packager original source full HEAD privacy and byte-stable page proof
        run: node --test cloudflare-yparty-worker/qa/p0-gated7-frozen-r2-packager.test.mjs
      - name: D6 real R2 source to actual Tienda Workerd cold reopen
        run: node --test cloudflare-yparty-worker/qa/p0-gated6-r2-to-real-tienda-workerd.test.mjs
      - name: Unchanged independent original100 transition quality physical GO
        run: |
          node scripts/architecture-2-port-score.cjs --json
          node --test test/p0-architecture-2-port-score.test.cjs
