name: Render Codex Reel A only
on:
  push:
    branches: [codex/reels-comparacion]
  workflow_dispatch:
jobs:
  render-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser || sudo apt-get install -y ffmpeg chromium
      - name: Render A
        working-directory: video/codex-reel-A
        run: |
          npm ci
          node music/score.mjs
          ffmpeg -y -i music/score.wav -af "highpass=f=30,equalizer=f=250:t=q:w=1:g=-2,loudnorm=I=-14:TP=-1.2:LRA=8" -c:a aac -b:a 192k assets/score.m4a
          CHROME=$(command -v chromium-browser || command -v chromium || command -v google-chrome)
          node render.mjs --frames --workers=1 --soft-gl --chrome="$CHROME"
          node render.mjs --encode --audio=assets/score.m4a --out=out/full.mp4 --fps=30
          ffmpeg -y -i out/full.mp4 -vf "scale='min(1280,iw)':-2" -c:v libx264 -crf 24 -preset medium -c:a aac -b:a 128k codex-reel-A.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate,channels,sample_rate -of json codex-reel-A.mp4 > codex-reel-A.ffprobe.json
          sha256sum codex-reel-A.mp4 > codex-reel-A.sha256.txt
          ffmpeg -y -ss 00:00:03 -i codex-reel-A.mp4 -frames:v 1 qa-03s.jpg
          ffmpeg -y -ss 00:00:12 -i codex-reel-A.mp4 -frames:v 1 qa-12s.jpg
          ffmpeg -y -ss 00:00:24 -i codex-reel-A.mp4 -frames:v 1 qa-24s.jpg
      - name: Upload A
        uses: actions/upload-artifact@v4
        with:
          name: codex-reel-A-rigorous
          path: |
            video/codex-reel-A/codex-reel-A.mp4
            video/codex-reel-A/codex-reel-A.ffprobe.json
            video/codex-reel-A/codex-reel-A.sha256.txt
            video/codex-reel-A/qa-03s.jpg
            video/codex-reel-A/qa-12s.jpg
            video/codex-reel-A/qa-24s.jpg
          if-no-files-found: error
