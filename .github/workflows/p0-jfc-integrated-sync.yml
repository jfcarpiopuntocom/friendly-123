name: P0 JFC integrated sync causal end-to-end synthetic gate
on:
  # Required by the master ruleset (no bypass actors): runs on every PR, never skipped by a path filter.
  pull_request:
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install synthetic IndexedDB outside repository
        run: npm install --no-save --prefix "$RUNNER_TEMP/p0-idb" fake-indexeddb --ignore-scripts --no-audit --no-fund
      - name: Integrated verification pass A
        run: |
          export NODE_PATH="$RUNNER_TEMP/p0-idb/node_modules"
          node --test test/p0-s0-pull-priority.test.mjs test/p0-s1-yjs-idb-replay.test.cjs test/p0-s3-compressed-checkpoint.test.cjs test/p0-s3-unknown-frame.test.cjs test/p0-s3-checkpoint-alert.test.cjs test/p0-movement-witness-opid.test.cjs test/p0-s4-outbox-per-op.test.cjs test/p0-s2-jfc-test-epoch.test.cjs test/p0-rollout-policy.test.cjs
      - name: Integrated verification pass B, same SHA
        run: |
          export NODE_PATH="$RUNNER_TEMP/p0-idb/node_modules"
          node --test test/p0-s1-yjs-idb-replay.test.cjs test/p0-s3-compressed-checkpoint.test.cjs test/p0-s3-unknown-frame.test.cjs test/p0-s3-checkpoint-alert.test.cjs test/p0-movement-witness-opid.test.cjs test/p0-s4-outbox-per-op.test.cjs test/p0-s2-jfc-test-epoch.test.cjs test/p0-rollout-policy.test.cjs
