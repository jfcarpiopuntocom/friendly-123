name: incident-record-payment-ci

on:
  push:
    branches:
      - incident/record-payment-ci-2026-10-03

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/ui-compact-hero-no-shell-2026-10-03
          fetch-depth: 3
      - name: Fetch isolated compact-hero fixture
        run: |
          git fetch origin incident/record-payment-ci-2026-10-03
          git show origin/incident/record-payment-ci-2026-10-03:test/incident-compact-hero.test.js > test/incident-compact-hero.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify no-shell hotfix identity
        run: |
          test "$(grep -oE 'f123-shell-v[0-9]+' docs/sw.js | head -1)" = "f123-shell-v443"
          test "$(grep -oE 'f123-shell-v[0-9]+' docs/version.json | head -1)" = "f123-shell-v443"
          test "$(wc -l < docs/index.html)" -eq 10384
          test "$(sha256sum docs/index.html | awk '{print $1}')" = "77c53150883a023519e47d99b062bc84d2d2d1536c1377188c3f972c0879a50b"
      - name: Focused compact hero regression
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/incident-compact-hero.test.js
      - name: Full suite
        run: npm test
      - name: Manifest deterministic
        run: |
          cp docs/version-manifest.json /tmp/version-manifest.before
          node scripts/gen-manifest.js
          cmp -s /tmp/version-manifest.before docs/version-manifest.json
      - name: Service worker integrity
        run: bash check-sw.sh
      - name: Repository guards
        run: bash .claude/guards.sh
      - name: Release diff whitespace check
        run: git diff --check 93531d2f207434698a5c8af0669ab21acf7b8494..HEAD
