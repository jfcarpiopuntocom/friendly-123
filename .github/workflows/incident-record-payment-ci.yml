name: incident-record-payment-ci

on:
  push:
    branches:
      - incident/record-payment-ci-2026-10-03

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v443-record-payment-only-2026-10-03
          fetch-depth: 2
      - name: Fetch isolated E2E fixture
        run: |
          git fetch origin incident/record-payment-ci-2026-10-03
          git show origin/incident/record-payment-ci-2026-10-03:test/incident-record-payment.test.js > test/incident-record-payment.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact v443 identity
        run: |
          test "$(grep -oE 'f123-shell-v[0-9]+' docs/sw.js | head -1)" = "f123-shell-v443"
          test "$(grep -oE 'f123-shell-v[0-9]+' docs/version.json | head -1)" = "f123-shell-v443"
          test "$(wc -l < docs/index.html)" -eq 10378
          test "$(sha256sum docs/index.html | awk '{print $1}')" = "5ed3ad267a7172a765ba49f32f4f17fe718ff39eeee5dbdab867da4526430841"
      - name: Focused Record Payment regression
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/incident-record-payment.test.js
      - name: Full suite
        run: npm test
      - name: Manifest deterministic
        run: |
          cp docs/version-manifest.json /tmp/version-manifest.before
          node scripts/gen-manifest.js
          cmp -s /tmp/version-manifest.before docs/version-manifest.json
      - name: Service worker integrity
        run: bash check-sw.sh
      - name: Repository guards
        run: bash .claude/guards.sh
      - name: Release diff whitespace check
        run: git diff --check ab64d71d1fd467653138759cefb7f5e84a950060..HEAD
