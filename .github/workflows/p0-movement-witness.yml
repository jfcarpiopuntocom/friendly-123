name: P0 movement-ledger authority, zero double-count
on:
  pull_request:
    paths: [docs/mock-backend.js, docs/sync-yjs.js, test/p0-movement-witness-opid.test.cjs, .github/workflows/p0-movement-witness.yml]
jobs:
  movement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --test test/p0-movement-witness-opid.test.cjs
      - run: node --test test/p0-movement-witness-opid.test.cjs
