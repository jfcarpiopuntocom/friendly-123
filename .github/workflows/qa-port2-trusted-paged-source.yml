name: "PORT2 real · trusted frozen history paging and manifest TDD"
on:
  push:
    branches: [port2/20261119-gate-d-paged-trusted-source]
  pull_request:
    branches: [master]
    paths:
      - cloudflare-yparty-worker/src/trusted-frozen-source.mjs
      - cloudflare-yparty-worker/qa/p0-gate-d-trusted-paged-source.test.mjs
      - .github/workflows/qa-port2-trusted-paged-source.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paged-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Source contract RED/GREEN (no customer data)
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test qa/p0-gate-d-trusted-paged-source.test.mjs
      - name: Real Worker previous Gate D regressions
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 qa/p0-gate-d-real-onstart-workerd.test.mjs qa/p0-gate-d-open-existing-workerd.test.mjs qa/p0-frozen-import-workerd.test.mjs qa/p0-full-export-workerd.test.mjs qa/p0-certified-frozen-import.test.mjs
