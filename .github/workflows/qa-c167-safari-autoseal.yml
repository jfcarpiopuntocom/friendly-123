name: C167 Safari iPhone bounded SW + C166 Commissions release seal
on:
  push:
    branches: [fix/c167-safari-ios-cache-integrity-v864]
    paths:
      - .github/workflows/qa-c167-safari-autoseal.yml
      - docs/sw.js
      - docs/version.json
      - docs/dashboard.html
      - test/p0-c167-safari-ios-install-memory-budget.test.cjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c167-safari-ios-cache-integrity-v864
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute real Safari installer and both authenticated Commissions projections
        run: |
          node --test test/p0-c165-safari-bounded-shell-precache.test.cjs test/p0-c167-safari-ios-install-memory-budget.test.cjs
          node --test test/p0-c166-commissions-total-first.test.cjs test/p0-belen-commissions-all-dates.test.cjs test/p0-c142-commission-conflict-local-day.test.cjs test/p0-c151-single-payee-commission.test.cjs
      - name: Deterministically build both UIs and seal manifest SHA
        run: |
          set -euo pipefail
          node scripts/build-app-entry.cjs
          node scripts/build-dashboard-entry.cjs
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
          bash check-sw.sh
      - name: Commit only reproducible assets to branch
        run: |
          set -euo pipefail
          git config user.name "friendly-123 release seal"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/app-inline-*.min.js docs/app-style-*.min.css docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "build(C167): seal v864 and Safari 2/1 startup resource budget"
            git push origin HEAD:refs/heads/fix/c167-safari-ios-cache-integrity-v864
          fi
