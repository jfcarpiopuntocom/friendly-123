name: C251 · Commissions non-exclusive group toggles
on:
  push:
    branches:
      - fix/c251-commissions-independent-toggles-20261123
  pull_request:
    paths:
      - 'docs/commissions-by-person.js'
      - 'test/p0-c251-commissions-independent-browser.test.cjs'
      - 'test/p0-c226-comisiones-botones-onoff.test.cjs'
      - '.github/workflows/qa-c251-commissions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c251-multi-group:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and existing Commissions regressions
        run: |
          node --check docs/commissions-by-person.js
          node --test test/p0-c226-comisiones-botones-onoff.test.cjs test/p0-c182-commissions-compact-view-switches.test.cjs test/p0-c247-filtros-acumulativos.test.cjs
      - name: Install browser QA without changing production files
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium webkit
      - name: C251 browser scenarios on served files and synthetic sales
        run: node --test --test-timeout=120000 test/p0-c251-commissions-independent-browser.test.cjs
