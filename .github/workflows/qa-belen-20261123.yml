name: Belén · partial credit + Category + historic Sold
on:
  push:
    branches:
      - fix/belen-three-flows-20261123
  pull_request:
    paths:
      - 'docs/plan-pagos-ui.js'
      - 'src/app/app-inline-01.js'
      - 'docs/app-inline-01.min.js'
      - 'docs/mock-backend.js'
      - 'test/p0-belen-20261123-three-flows.test.cjs'
      - '.github/workflows/qa-belen-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/p0-belen-20261123-three-flows.test.cjs
