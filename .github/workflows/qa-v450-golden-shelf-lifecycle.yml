name: qa-v450-golden-shelf-lifecycle

on:
  push:
    branches:
      - "hotfix/v450-v448-golden-shelf-lifecycle"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Shelf lifecycle race regressions
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/shelf-lifecycle-race-v448.test.js
      - name: Actual Yjs bridge
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/yjs-bridge.test.js
      - name: Historical shelf/photo regressions
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/perchas-hotfix-v444.test.js test/perchas-photo-selfheal-v446.test.js test/shelf-photo-integrity-v446.test.js test/shelf-photo-durability-v449.test.js test/photo-backup-evidence-v449.test.js
      - name: WebKit iPhone-size photo smoke
        run: node .claude/smoke-v449-photo-webkit.cjs
      - name: Full suite
        run: node --require ./test/helpers/sin-red-produccion.cjs --test test/*.test.js
      - name: Deterministic manifest
        run: |
          node scripts/gen-manifest.js
          git diff --exit-code -- docs/version-manifest.json
      - name: Service-worker guards
        run: bash check-sw.sh
      - name: Diff hygiene
        run: git diff --check origin/master...HEAD
