name: regenerate-v448-golden2-manifest

on:
  push:
    branches: [hotfix/v448-golden2-photo-recovery]

permissions:
  contents: write

concurrency:
  group: v448-golden2-manifest
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v448-golden2-photo-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gen-manifest.js
      - name: Commit manifest only if changed
        run: |
          if git diff --quiet -- docs/version-manifest.json; then
            echo "manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version-manifest.json
          git commit -m "integrity(v448 golden2): regenerate shell manifest"
          git push origin HEAD:hotfix/v448-golden2-photo-recovery
