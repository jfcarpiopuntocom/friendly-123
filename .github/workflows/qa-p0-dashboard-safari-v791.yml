name: P0 Safari v791 central Owner parity RED-GREEN
on:
  push:
    branches: [fix/p0-safari-dashboard-central-owner-parity-v791]
  pull_request:
    paths:
      - src/dashboard/dashboard-main.js
      - docs/dashboard-main.min.js
      - test/p0-dashboard-safari-central-owner-parity.test.cjs
      - .github/workflows/qa-p0-dashboard-safari-v791.yml
permissions:
  contents: read
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real dashboard login handler Owner/Admin checks
        run: node --test test/p0-dashboard-safari-central-worker-contract.test.cjs test/p0-dashboard-safari-central-owner-parity.test.cjs test/p0-dashboard-safari-owner-fallback.test.cjs test/p0-dashboard-login-peer-timeout.test.cjs
      - name: Official build/release seal parity
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-dashboard-entry.cjs --check
          bash check-sw.sh
