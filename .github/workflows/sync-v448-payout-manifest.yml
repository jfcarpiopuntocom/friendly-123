name: sync-v448-payout-manifest

on:
  push:
    branches: ["engineering/v448-payout-ledger-v1"]

permissions:
  contents: write

concurrency:
  group: sync-v448-payout-manifest
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[manifest-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate canonical shell manifest
        run: node scripts/gen-manifest.js
      - name: Commit only the generated manifest
        run: |
          if git diff --quiet -- docs/version-manifest.json; then
            echo "Manifest already canonical."
            exit 0
          fi
          git config user.name "friendly-123 release bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/version-manifest.json
          git commit -m "chore: sync payout shell manifest [manifest-sync]"
          git push origin HEAD:engineering/v448-payout-ledger-v1
