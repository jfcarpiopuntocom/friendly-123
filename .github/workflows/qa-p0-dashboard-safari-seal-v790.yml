name: P0 Safari Dashboard v790 official deterministic artifact seal
on:
  push:
    branches: [fix/p0-safari-dashboard-owner-local-verifier-v790]
    paths:
      - docs/version.json
permissions:
  contents: write
jobs:
  build-and-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-safari-dashboard-owner-local-verifier-v790
          persist-credentials: true
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build dashboard from real source and seal exact published bytes
        run: |
          set -euo pipefail
          node scripts/build-dashboard-entry.cjs
          node scripts/build-dashboard-entry.cjs --check
          node scripts/gen-manifest.js
      - name: Commit official reproducible assets to isolated branch once
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js; then
            git config user.name "friendly-123 release seal"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/dashboard-main.min.js docs/dashboard-main.min.css docs/version-manifest.json docs/sw.js
            git commit -m "release(v790): seal Safari Owner fallback official build and shell"
            git push origin HEAD:fix/p0-safari-dashboard-owner-local-verifier-v790
          fi
          bash check-sw.sh
