name: qa-v448-g07-hex-photo

on:
  push:
    branches:
      - master
      - "hotfix/v448-golden-*"
    paths:
      - "docs/core/**"
      - "docs/application/**"
      - "docs/vista-perchas.js"
      - "docs/index.html"
      - "docs/sw.js"
      - "docs/version.json"
      - "docs/version-manifest.json"
      - "test/architecture-hexagonal.test.js"
      - "test/shelf-photo-policy-hex.test.js"
      - "test/recover-shelf-photo-ports.test.js"
      - ".github/workflows/qa-v448-g07-hex-photo.yml"
  pull_request:
    paths:
      - "docs/core/**"
      - "docs/application/**"
      - "docs/vista-perchas.js"
      - "docs/index.html"
      - "docs/sw.js"
      - "docs/version.json"
      - "docs/version-manifest.json"
      - "test/architecture-hexagonal.test.js"
      - "test/shelf-photo-policy-hex.test.js"
      - "test/recover-shelf-photo-ports.test.js"

permissions:
  contents: read

jobs:
  hex-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check docs/core/shelf-photo-policy.js
          node --check docs/application/recover-shelf-photo.js
          node --check docs/vista-perchas.js
      - name: Domain + application + architecture
        run: |
          node --test             test/shelf-photo-policy-hex.test.js             test/recover-shelf-photo-ports.test.js             test/architecture-hexagonal.test.js
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: P0 native first-join, stock and causal replay (isolated synthetic data)
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=30000 \
            test/incident-first-sync-integrity-v558.test.js \
            test/incident-stale-stock-metadata-v558.test.js \
            test/incident-yjs-receive-queue-v558.test.js \
            test/incident-yjs-causal-replay-v559.test.js \
            test/incident-stock-monotonic-clock-v559.test.js \
            test/yjs-unresolved-checkpoint.test.js
      - name: Native cross-device regression (inventory, team, money, Yjs)
        run: |
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=45000 \
            test/auditoria-belen-v556-e2e.test.js \
            test/categorias-sync.test.js \
            test/idiomarte-owner-admin-expenses.test.js \
            test/impuesto-cuaderno.test.js \
            test/linus-sync-persona.test.js \
            test/yjs-device-role-stability.test.js \
            test/yjs-durable-outbox.test.js \
            test/yjs-idle-write-budget.test.js
      - name: Shell integrity
        run: bash check-sw.sh
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
