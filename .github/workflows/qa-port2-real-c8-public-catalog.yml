name: "PORT2 REAL C8 · browser private/public catalog boundary"
on:
  push:
    branches: [port2/20261119-gatec8-browser-safe-catalog]
  pull_request:
    branches: [master]
    paths:
      - src/port2-public-catalog-bridge.mjs
      - cloudflare-yparty-worker/qa/p0-port2-public-catalog-bridge.test.mjs
      - .github/workflows/qa-port2-real-c8-public-catalog.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
      - name: RED-GREEN client public catalog root/fields isolation
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          git rev-parse HEAD
          node --test qa/p0-port2-public-catalog-bridge.test.mjs
      - name: Real Worker projection and Gate D regressions
        working-directory: cloudflare-yparty-worker
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 qa/p0-safe-catalog-projection.test.mjs qa/p0-gated6-frozen-r2-source-workerd.test.mjs
