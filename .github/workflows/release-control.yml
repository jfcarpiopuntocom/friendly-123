name: release-control
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Release continuity gate
    runs-on: ubuntu-24.04
    # Official Playwright image: browsers + OS libraries match package-lock 1.62.1.
    # Avoids 40-minute apt mirror download stalls seen in run #39834743303.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checkout owns the mounted worktree; root in the official CI container
      # needs this exact path trusted before git-based release validation.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve approved capabilities and release identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release-control.cjs validate "${BASE_SHA:-HEAD^}"
      - name: Parse operational UI
        run: node .claude/check-inline.cjs docs/index.html
      - name: Fast-fail mobile dashboard payments in Chromium and WebKit
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-timeout=120000 test/dashboard-embed.test.js
      - name: Pin historic v607/v606 sync bridge fixtures at immutable SHAs (synthetic tests only)
        run: |
          git fetch --no-tags --depth=1 origin 82952a84958641010c48bfbee6aab80007ba12e9
          git show 82952a84958641010c48bfbee6aab80007ba12e9:docs/sync-yjs.js > /tmp/f123_v607_sync_yjs.js
          git fetch --no-tags --depth=1 origin 7e51ed51560d6138866dae98e4a01ff1772db51c
          git show 7e51ed51560d6138866dae98e4a01ff1772db51c:docs/sync-yjs.js > /tmp/f123_v606_sync_yjs.js
          test -s /tmp/f123_v607_sync_yjs.js
          test -s /tmp/f123_v606_sync_yjs.js
      - name: Full regression suite including browser and financial contracts
        env:
          F123_V607_SYNC_FILE: /tmp/f123_v607_sync_yjs.js
          F123_V606_SYNC_FILE: /tmp/f123_v606_sync_yjs.js
        run: |
          set -euo pipefail
          # Physical-style 2/3-browser RTC, concurrent sales and p95 latency
          # must own the runner CPU. Keep EVERY assertion, timeout and SLA.
          HEAVY=(test/peer-sync-browser.test.js test/linus-dos-pestanas.test.js test/sync-latencia-dos-aparatos-v599.test.cjs)
          for t in "${HEAVY[@]}"; do test -f "$t" || exit 1; done
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 "${HEAVY[@]}"
          # Run every other .test.js/.test.cjs in the original four-worker mode.
          # Enumerate by file to ensure the dedicated heavy files are not run twice.
          mapfile -t REST < <(find test -type f \( -name '*.test.js' -o -name '*.test.cjs' \) \
            ! -name 'peer-sync-browser.test.js' ! -name 'linus-dos-pestanas.test.js' \
            ! -name 'sync-latencia-dos-aparatos-v599.test.cjs' | sort)
          (( ${#REST[@]} > 0 ))
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=4 --test-timeout=120000 "${REST[@]}"
      - name: Artifact integrity
        run: |
          cp docs/version-manifest.json /tmp/manifest-before.json
          node scripts/gen-manifest.js
          diff -u /tmp/manifest-before.json docs/version-manifest.json
          bash check-sw.sh
          git diff --check
