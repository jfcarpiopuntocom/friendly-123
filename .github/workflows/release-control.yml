name: release-control
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Release continuity gate
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    defaults:
      run:
        shell: bash -e {0}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release identity, immutable manifest and generated assets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          BASE="${BASE_SHA:-HEAD^}"
          git cat-file -e "$BASE^{commit}"
          node scripts/release-control.cjs validate "$BASE"
          node scripts/build-app-entry.cjs --check
          node scripts/build-dashboard-entry.cjs --check
          node .claude/check-inline.cjs docs/index.html
          cp docs/version-manifest.json /tmp/p0-manifest-before.json
          node scripts/gen-manifest.js
          diff -u /tmp/p0-manifest-before.json docs/version-manifest.json
          bash check-sw.sh
          git diff --check
      - name: Synthetic-only pinned historical sync fixtures
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 82952a84958641010c48bfbee6aab80007ba12e9
          git show 82952a84958641010c48bfbee6aab80007ba12e9:docs/sync-yjs.js > /tmp/f123_v607_sync_yjs.js
          git fetch --no-tags --depth=1 origin 7e51ed51560d6138866dae98e4a01ff1772db51c
          git show 7e51ed51560d6138866dae98e4a01ff1772db51c:docs/sync-yjs.js > /tmp/f123_v606_sync_yjs.js
          test -s /tmp/f123_v607_sync_yjs.js
          test -s /tmp/f123_v606_sync_yjs.js
          npm install --no-save --prefix "$RUNNER_TEMP/p0-s4-idb" fake-indexeddb@6.2.5 --ignore-scripts --no-audit --no-fund
      - name: Sale ACK, finance, stock, PIN, causal Sync3, actual browser CAS and touched-area regressions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          NODE_PATH: ${{ runner.temp }}/p0-s4-idb/node_modules
          F123_V607_SYNC_FILE: /tmp/f123_v607_sync_yjs.js
          F123_V606_SYNC_FILE: /tmp/f123_v606_sync_yjs.js
        run: |
          set -euo pipefail
          BASE="${BASE_SHA:-HEAD^}"
          mapfile -t TESTS < <(node scripts/p0-hotfix-tests.cjs "$BASE" HEAD)
          (( ${#TESTS[@]} > 0 )) || { echo "Empty test selection"; exit 1; }
          printf 'P0: %s test files, no caps, no skips\n' "${#TESTS[@]}"
          printf '%s\n' "${TESTS[@]}" >> "$GITHUB_STEP_SUMMARY"
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=2 --test-timeout=120000 "${TESTS[@]}"
  full:
    name: Full regression advisory
    runs-on: ubuntu-24.04
    # Official Playwright image: browsers + OS libraries match package-lock 1.62.1.
    # Avoids 40-minute apt mirror download stalls seen in run #39834743303.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checkout owns the mounted worktree; root in the official CI container
      # needs this exact path trusted before git-based release validation.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve approved capabilities and release identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release-control.cjs validate "${BASE_SHA:-HEAD^}"
      - name: Parse operational UI
        run: node .claude/check-inline.cjs docs/index.html
      - name: Fast-fail mobile dashboard payments in Chromium and WebKit
        run: node --require ./test/helpers/sin-red-produccion.cjs --test --test-timeout=120000 test/dashboard-embed.test.js
      - name: Pin historic v607/v606 sync bridge fixtures at immutable SHAs (synthetic tests only)
        run: |
          git fetch --no-tags --depth=1 origin 82952a84958641010c48bfbee6aab80007ba12e9
          git show 82952a84958641010c48bfbee6aab80007ba12e9:docs/sync-yjs.js > /tmp/f123_v607_sync_yjs.js
          git fetch --no-tags --depth=1 origin 7e51ed51560d6138866dae98e4a01ff1772db51c
          git show 7e51ed51560d6138866dae98e4a01ff1772db51c:docs/sync-yjs.js > /tmp/f123_v606_sync_yjs.js
          test -s /tmp/f123_v607_sync_yjs.js
          test -s /tmp/f123_v606_sync_yjs.js
      - name: Install pinned synthetic IndexedDB test emulator
        run: npm install --no-save --prefix "$RUNNER_TEMP/p0-s4-idb" fake-indexeddb@6.2.5 --ignore-scripts --no-audit --no-fund
      - name: Full regression suite including browser and financial contracts
        env:
          NODE_PATH: ${{ runner.temp }}/p0-s4-idb/node_modules
          F123_V607_SYNC_FILE: /tmp/f123_v607_sync_yjs.js
          F123_V606_SYNC_FILE: /tmp/f123_v606_sync_yjs.js
        # The browser latency and WebRTC suites need CPU while 2,400+ other
        # tests run. Two file workers keep all assertions and peer concurrency.
        # Load-only flakes (one random file per 2,400-test run): rerun ONLY the failed files, whole and alone.
        # No name filter, so no subtest is silently skipped; a real regression fails again; >3 files is not a flake.
        shell: bash
        run: |
          set -euo pipefail
          if ! node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=2 --test-timeout=120000 "test/**/*.test.js" "test/**/*.test.cjs" 2>&1 | tee /tmp/full.tap; then
            mapfile -t FAILED < <(awk '/^ *not ok [0-9]+ /{f=1} f && /location: .*test\//{match($0,/test\/[^:'"'"']+/);print substr($0,RSTART,RLENGTH);f=0}' /tmp/full.tap | sort -u)
            printf 'Failed under load, retrying alone: %s\n' "${FAILED[@]}"
            (( ${#FAILED[@]} >= 1 && ${#FAILED[@]} <= 3 )) || exit 1
            node --require ./test/helpers/sin-red-produccion.cjs --test --test-concurrency=1 --test-timeout=120000 "${FAILED[@]}"
          fi
      - name: Artifact integrity
        run: |
          cp docs/version-manifest.json /tmp/manifest-before.json
          node scripts/gen-manifest.js
          diff -u /tmp/manifest-before.json docs/version-manifest.json
          bash check-sw.sh
          git diff --check
