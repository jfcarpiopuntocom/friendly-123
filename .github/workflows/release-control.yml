name: release-control
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Release continuity gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Preserve approved capabilities and release identity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release-control.cjs validate "${BASE_SHA:-HEAD^}"
      - name: Parse operational UI
        run: node .claude/check-inline.cjs docs/index.html
      - name: Surgical diagnosis of WebKit commission overflow
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='test/dashboard-embed.test.js';
          let s=fs.readFileSync(p,'utf8');
          const mark="  console.log(name+' report before embed '+JSON.stringify(before));";
          const extra="  if(before.scrollWidth>before.width+1)console.log(name+' offending CM descendants '+JSON.stringify(await dash.evaluate(()=>{const root=document.getElementById('cm');const over=[...root.querySelectorAll('*')].map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,cls:e.className,right:r.right,left:r.left,width:r.width,text:(e.textContent||'').trim().slice(0,55)};}).filter(x=>x.right>innerWidth+1).slice(0,25);const isolation=[...root.children].map(e=>{const old=e.getAttribute('style');e.style.setProperty('display','none','important');const width=document.documentElement.scrollWidth;if(old===null)e.removeAttribute('style');else e.setAttribute('style',old);return {tag:e.tagName,cls:e.className,without:width};});return {over,isolation};})));";
          if(!s.includes(mark))throw Error('test insertion anchor absent');
          const extra2="  if(before.scrollWidth>before.width+1)console.log(name+' CM BAR direct children '+JSON.stringify(await dash.evaluate(()=>{const b=document.querySelector('.cm-bar');const list=[b,...b.children,...b.querySelectorAll('select,button,label')];const elements=list.map(e=>{const r=e.getBoundingClientRect(),c=getComputedStyle(e);return {tag:e.tagName,cls:e.className,text:(e.textContent||'').slice(0,75),left:r.left,right:r.right,width:r.width,client:e.clientWidth,scroll:e.scrollWidth,minWidth:c.minWidth,maxWidth:c.maxWidth,flex:c.flex,overflow:c.overflow};});const isolation=[...b.children].map(e=>{const old=e.getAttribute('style');e.style.setProperty('display','none','important');const without=document.documentElement.scrollWidth;if(old===null)e.removeAttribute('style');else e.setAttribute('style',old);return {tag:e.tagName,without};});return {elements,isolation};})));";
          fs.writeFileSync(p,s.replace(mark,mark+'\n'+extra+'\n'+extra2));
          NODE
          node --require ./test/helpers/sin-red-produccion.cjs --test --test-timeout=120000 test/dashboard-embed.test.js
      - name: Full regression suite including browser and financial contracts
        run: npm test
      - name: Artifact integrity
        run: |
          cp docs/version-manifest.json /tmp/manifest-before.json
          node scripts/gen-manifest.js
          diff -u /tmp/manifest-before.json docs/version-manifest.json
          bash check-sw.sh
          git diff --check
