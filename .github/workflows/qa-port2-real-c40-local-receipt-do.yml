name: PORT2 C40 · real Workerd SQLite local receipt to authoritative DO receipt
on:
  push:
    branches: [port2/20261119-c40-local-receipt-to-do-receipt-v817]
  pull_request:
    branches: [master]
    paths:
      - docs/sync-yjs.js
      - cloudflare-yparty-worker/qa/p0-c40-local-receipt-to-do-receipt-workerd.test.mjs
      - .github/workflows/qa-port2-real-c40-local-receipt-do.yml
permissions: {contents: read}
jobs:
  c40-local-receipt-do:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cd cloudflare-yparty-worker
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 --test-timeout=120000 \
            qa/p0-c40-local-receipt-to-do-receipt-workerd.test.mjs
          cd ..
          node --test --test-concurrency=1 --test-timeout=120000 \
            test/p0-c31-runtime-commercial-photo-role-cutover.test.cjs \
            test/p0-c38-legacy-transport-quiescence.test.cjs \
            test/p0-architecture-2-port-score.test.cjs
          bash check-sw.sh
