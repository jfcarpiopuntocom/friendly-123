name: P0 Belen shelf pointer CAS source
on:
  pull_request:
    paths:
      - 'docs/mock-backend.js'
      - 'test/p0-belen-shelf-photo-pointer-cas.test.cjs'
      - '.github/workflows/p0-belen-shelf-pointer-cas.yml'
  workflow_dispatch:
jobs:
  shelf-pointer-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/p0-belen-shelf-photo-pointer-cas.test.cjs
