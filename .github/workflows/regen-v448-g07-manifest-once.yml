name: regen-v448-g07-manifest-once

on:
  push:
    branches: [hotfix/v448-golden-hex-photo-core]
    paths:
      - ".github/workflows/regen-v448-g07-manifest-once.yml"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v448-golden-hex-photo-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate deterministic shell manifest
        run: node scripts/gen-manifest.js
      - name: Commit manifest only if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/version-manifest.json; then
            echo "manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/version-manifest.json
          git commit -m "integrity(v448 G07): regenerate shell manifest"
          git push origin HEAD:hotfix/v448-golden-hex-photo-core
