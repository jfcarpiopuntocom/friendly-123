(function(){

    if(localStorage.getItem(K))return;

    localStorage.setItem(K,"1");
    navigator.serviceWorker.getRegistrations().then(function(regs){
      if(!regs.length)return;
      var found=false;
      regs.forEach(function(r){
        if(r.active&&r.active.scriptURL&&r.active.scriptURL.indexOf("sw.js")!==-1){
          found=true;
          try{r.unregister()}catch(_){}
        }
      });
      if(!found)return;
      // Purgar caches, luego reload con setTimeout para que el unregister asiente.
      (caches.keys()||Promise.resolve([])).then(function(cs){
        var dels=(cs||[]).map(function(c){try{return caches.delete(c)}catch(_){return Promise.resolve()}});
        return Promise.all(dels);

    }).catch(function(){});

})();

<!-- TEMA CLARO/OSCURO (JFC 2026-09-26). LEER ANTES DE TOCAR:
     - Por defecto CLARO, igual que siempre. "oscuro" es una eleccion por aparato
       (localStorage oc_tema), nunca viaja por sync ni se impone.
     - Se aplica AQUI, en el <head> y antes de pintar: sin destello blanco al abrir.
     - Tecnica: invertir la pagina entera y girar el tono 180 grados. Asi los colores
       del semaforo conservan su tono y todo el texto conserva su contraste, sin
       reescribir los cientos de colores en linea de la app. Fotos, video, lienzos e
       iframes se re-invierten para verse con sus colores reales.
     - NO cambiar el meta color-scheme "light only" de arriba: el sistema no debe
       oscurecer por su cuenta (fue el bug de legibilidad de iOS/WhatsApp). El oscuro
       de la app es este, y solo si la persona lo elige. -->
<style>
  html[data-tema="oscuro"]{filter:invert(1) hue-rotate(180deg);background:#FFFFFF;}
  html[data-tema="oscuro"] img,html[data-tema="oscuro"] video,html[data-tema="oscuro"] canvas,
  html[data-tema="oscuro"] iframe,html[data-tema="oscuro"] .oc-sin-invertir{filter:invert(1) hue-rotate(180deg) !important;}

<script>
  window.OCTema = (function () {
    var CLAVE = "oc_tema";
    function actual() { return document.documentElement.getAttribute("data-tema") === "oscuro" ? "oscuro" : "claro"; }
    function aplicar(t) {
      if (t === "oscuro") document.documentElement.setAttribute("data-tema", "oscuro");
      else document.documentElement.removeAttribute("data-tema");
    }
    function poner(t) {
      t = t === "oscuro" ? "oscuro" : "claro";
      try { localStorage.setItem(CLAVE, t); } catch (e) {}
      aplicar(t);
      try { window.dispatchEvent(new CustomEvent("oc-tema-change", { detail: t })); } catch (e) {}
    }
    try { aplicar(localStorage.getItem(CLAVE)); } catch (e) {}
    return { actual: actual, poner: poner, alternar: function () { poner(actual() === "oscuro" ? "claro" : "oscuro"); } };
  })();
</script>

     se interpreta como doble-tap = zoom; la pÃ¡gina salta de escala y rompe la

  /* ================= NAV â€” barra inferior en mÃ³vil, riel lateral en tablet/desktop ================= */
  nav{
    display:flex;
    gap:4px;
    /* Case plateado liso (JFC 2026-08-05): FUERA la veta/microrayas verticales
       â€” leian como lineas zebra y agregaban ruido. La chapa del case es un
       gradiente vertical limpio; el relieve metalico ahora vive en los BOTONES
       (teclas del case), no en una textura de fondo. NO reintroducir el
       repeating-linear-gradient aqui. */
    background-color:var(--plata);
    background-image:
      linear-gradient(180deg, var(--plata-brillo) 0%, var(--plata-claro) 22%, var(--plata) 60%, var(--plata-media) 100%);
    border-top:2px solid var(--bisel-sombra);
    box-shadow:inset 0 1px 0 var(--bisel-luz);
    position:fixed;
    left:0; right:0; bottom:0;
    /* ALTURA FIJA + content-box (homologado de AMIGABLE, 2026-07-28).
       Con border-box (el default aqui), la altura INCLUIA el safe-area, asi
       que en iPhones con notch el padding inferior se comia el alto util y
       aplastaba los botones. Con content-box el alto del contenido es fijo y
       solo el padding absorbe el home indicator. align-items:center evita
       que los botones se estiren si iOS cambia el inset al colapsar la barra
       de URL â€” la causa de que la nav "creciera" hasta el siguiente refresh. */
    box-sizing:content-box;
    height:var(--nav-h);
    align-items:center;
    padding:4px 6px env(safe-area-inset-bottom, 4px);
    z-index:35;
    /* Con 7 botones (Comisiones y Avanzado se agregaron despuÃ©s), flex:1
       ya no cabÃ­a en pantallas angostas y los Ãºltimos quedaban totalmente
       fuera del viewport, sin ninguna forma de llegar a ellos (ni siquiera
       con swipe, porque nav no tenÃ­a overflow-x). Ahora se puede deslizar
       horizontalmente, y un botÃ³n parcialmente visible en el borde es la
       pista de que hay mÃ¡s â€” sin flechas ni indicadores extra que mantener. */
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  /* ============ TARJETAS INVENTARIO â€” SIMON-STYLE ============ */
  /* Colores vivos + esquinas redondeadas + hover. Portado de OC. */

    padding:16px;

  /* Intensidad/degradÃ© por color (JFC 2026-07-04): el color base y el
     estado que dispara cada uno NO cambian (eso sigue siendo el canon
     estricto de calcularEstado() en server.js/mock-backend.js/pocketbase-
     client.js, religiosamente identico en los 3). Lo que se enriquece aqui
     es solo el RENDER: degradÃ© full->dk para dar profundidad, y en rojo
     (emergencia) un pulso sutil que sube la urgencia percibida un grado
     mas que naranja (urgente pero no emergencia). Negro es la excepcion:
     nada de degradÃ© de color, solo un vinieta hacia el negro absoluto â€”
     "oscuridad que se traga todo". */
  /* ============ ENCENDIDOS EN LA PROPIA TARJETA (JFC 2026-07-07) ============
     La semaforo de colores se APLICA a la tarjeta entera, no se dibuja como
     indicador aparte (la mini-escala de barras quedo DORMANT abajo):
       n1 (tenue)     -> fondo -bg del color, borde base, TINTA OSCURA
       n2 (medio)     -> degrade base->dk (el look clasico), texto blanco
       n3 (encendido) -> degrade cargado al -dk + GLOW del propio color
     Mismo color siempre; solo cambia que tan fuerte esta encendido.
     Sin clase n* cae al look n2 (retrocompatible). Negro es excepcion: sus
     3 niveles oscurecen hacia el negro absoluto, texto blanco siempre. */
  /* === 1 TONO PLANO POR ESTADO (JFC 2026-08-05) ===
     Se retiran los degradados y los overrides por nivel (.n1/.n2/.n3): daban
     a cada tarjeta un tono distinto segun intensidad, que es exactamente el
     semaforo de colores retirado. Ahora el estado es UN color plano y el -dk solo
     pinta el borde/bisel. El pulso del rojo se queda: es movimiento, no un
     tono extra. NO reintroducir degradados por nivel. */
  /* COLORES EXACTOS DEL SEMÃFORO (JFC 2026-08-26) â€” paleta BASE de la UX (solo
     sin azul). Antes usaban var(--sim-*-dk), shades oscuros (amarillo=#9E7C00

     los mismos hex del semÃ¡foro en toda la app. Esta regla pisa a las de arriba. */
  .caja.verde{border-color:#00C87A;border-width:4px;}
  .caja.amarillo{border-color:#FFC700;border-width:4px;}
  .caja.rojo{border-color:#E8365D; animation:pulsoEmergencia 2.2s ease-in-out infinite;}
  .caja.naranja{border-color:#F97316;border-width:4px;}
  .caja.negro{border-color:#0A0A0F;border-width:4px;}
  @keyframes pulsoEmergencia{
    0%, 100%{box-shadow:0 0 0 0 rgba(232,54,93,0.55), 0 4px 8px rgba(0,0,0,0.18);}
    50%{box-shadow:0 0 0 8px rgba(232,54,93,0), 0 4px 8px rgba(0,0,0,0.18);}
  }
  /* Fondos oscuros: texto blanco */
  .caja.verde .nombre,.caja.rojo .nombre,.caja.naranja .nombre,.caja.negro .nombre{color:var(--ink) !important;}
  .caja.verde .detalle,.caja.rojo .detalle,.caja.naranja .detalle,.caja.negro .detalle{color:var(--ink-soft) !important;}
  .caja.verde .stock,.caja.rojo .stock,.caja.naranja .stock,.caja.negro .stock{color:var(--ink) !important;}/* M3 (2026-08-14): esta regla forzaba BLANCO en los botones de ajuste
     porque la tarjeta era un rectangulo de color oscuro. Ahora el fondo es
     blanco y la foto manda, asi que el blanco los volvia invisibles.
     Pasan a tinta. Si algun dia vuelve el relleno solido, esto vuelve a blanco. */
  .caja.verde [data-ajuste-menos],.caja.rojo [data-ajuste-menos],.caja.naranja [data-ajuste-menos],.caja.negro [data-ajuste-menos],
  .caja.verde [data-ajuste-mas],.caja.rojo [data-ajuste-mas],.caja.naranja [data-ajuste-mas],.caja.negro [data-ajuste-mas],
  .caja.verde [data-estrella-toggle],.caja.rojo [data-estrella-toggle],.caja.naranja [data-estrella-toggle],.caja.negro [data-estrella-toggle]
  {color:var(--ink) !important; border-color:var(--ink) !important;}
  /* Dorado=oportunidad: tinta oscura (el amarillo nunca soporta texto blanco) */
  .caja.amarillo .nombre{color:#0F1923 !important;}
  .caja.amarillo .detalle{color:#2C3E50 !important;}
  .caja.amarillo .stock{color:#0F1923 !important;}
  .caja.amarillo [data-ajuste-menos],.caja.amarillo [data-ajuste-mas],.caja.amarillo [data-estrella-toggle]{color:#0F1923 !important; border-color:var(--sim-amarillo-dk) !important;}
  /* Nivel 1 (fondo tenue -bg, claro): tinta oscura para legibilidad â€” regla
     absoluta de contraste. Negro queda fuera: su n1 sigue siendo oscuro.
     3 clases (>2) para ganarle a las reglas blancas de arriba. */
  /* 1 TONO (2026-08-05): n1 ya no es un tinte claro, es el color solido,
     asi que forzar tinta oscura aqui dejaba el texto ilegible. Se anula. */
