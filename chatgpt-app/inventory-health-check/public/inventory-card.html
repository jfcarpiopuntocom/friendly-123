<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light;--ink:#13233a;--paper:#fff;--muted:#d9e0e8;--red:#e8364f;--orange:#f28c28;--black:#111827;--yellow:#ffc72c;--green:#00a86b}:root[data-theme="dark"]{color-scheme:dark;--ink:#f7f4ec;--paper:#111827;--muted:#475569}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,sans-serif;background:transparent;color:var(--ink)}#app{max-width:760px;padding:4px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.title{font-weight:850;font-size:17px}.controls{display:flex;gap:6px;flex-wrap:wrap}.controls button{min-width:42px;min-height:36px;border:1px solid var(--muted);border-radius:8px;background:var(--paper);color:var(--ink);font-weight:750}.summary{font-weight:750;margin:0 0 8px}.row{display:grid;grid-template-columns:16px minmax(100px,.75fr) 1.5fr;gap:10px;align-items:center;padding:9px 10px;border:2px solid var(--muted);border-radius:10px;background:var(--paper);margin:6px 0}.dot{width:14px;height:14px;border-radius:50%;outline:1px solid rgba(127,127,127,.25)}.red{background:var(--red)}.orange{background:var(--orange)}.black{background:var(--black)}.yellow{background:var(--yellow)}.green{background:var(--green)}.name{font-weight:800}.note{font-size:13px;margin-top:10px}.more{margin-top:8px;font-size:13px}@media(max-width:520px){.row{grid-template-columns:16px 1fr}.why{grid-column:2}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><script>
(()=>{const o=(window.openai&&window.openai.toolOutput)||{};let lang=o.locale||'en';let theme=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';const T={en:{title:'Inventory Health Check',summary:c=>`${c.red||0} urgent · ${c.orange||0} low · ${c.black||0} dead weight · ${c.yellow||0} stars · ${c.green||0} healthy`,note:'Read-only triage of the inventory you supplied. No orders or inventory changes are made.',theme:'Theme'},es:{title:'Chequeo de Salud de Inventario',summary:c=>`${c.red||0} urgentes · ${c.orange||0} bajos · ${c.black||0} peso muerto · ${c.yellow||0} estrellas · ${c.green||0} sanos`,note:'Triaje de solo lectura del inventario que enviaste. No hace pedidos ni modifica inventario.',theme:'Tema'},pt:{title:'Check-up de Saúde do Estoque',summary:c=>`${c.red||0} urgentes · ${c.orange||0} baixos · ${c.black||0} parados · ${c.yellow||0} estrelas · ${c.green||0} saudáveis`,note:'Triagem somente de leitura do estoque enviado. Não faz pedidos nem altera o estoque.',theme:'Tema'}};
const reason=(x,l)=>{const p=x.reasonParams||{},n=p.n,pct=p.pct;const m={en:{out:'Out of stock',red:`Only ${n} left: reorder now`,low:`Getting low (${n} left)`,dormant:`No sale in ${n} days: review discount, bundle, return, or exit options`,margin:`Strong gross margin (${pct}%): keep it visible`,healthy:'Healthy',expired:`Expired ${n} day(s) ago: remove it from sale`,expiresSoon:`Expires in ${n} day(s): sell it now`,expiresFirst:`Expires in ${n} days: sell it first`},es:{out:'Sin stock',red:`Queda ${n}: repón ahora`,low:`Queda poco (${n})`,dormant:`Sin venta en ${n} días: revisa descuento, combo, devolución o salida`,margin:`Margen bruto fuerte (${pct}%): mantenlo visible`,healthy:'Sano',expired:`Venció hace ${n} día(s): retíralo de la venta`,expiresSoon:`Vence en ${n} día(s): véndelo ya`,expiresFirst:`Vence en ${n} días: véndelo primero`},pt:{out:'Sem estoque',red:`Resta ${n}: reponha agora`,low:`Estoque baixo (${n})`,dormant:`Sem venda há ${n} dias: revise desconto, combo, devolução ou saída`,margin:`Margem bruta forte (${pct}%): mantenha visível`,healthy:'Saudável',expired:`Venceu há ${n} dia(s): retire da venda`,expiresSoon:`Vence em ${n} dia(s): venda agora`,expiresFirst:`Vence em ${n} dias: venda primeiro`}};return(m[l]&&m[l][x.reasonCode])||x.why||x.reasonCode};
const esc=s=>String(s).replace(/[&<>\"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));function render(){document.documentElement.dataset.theme=theme;const t=T[lang]||T.en,c=o.counts||{},items=o.items||[];document.getElementById('app').innerHTML=`<div class="top"><div class="title">${t.title}</div><div class="controls"><button data-l="en">EN</button><button data-l="es">ES</button><button data-l="pt">PT</button><button id="themeBtn" aria-label="${t.theme}">${theme==='dark'?'Dark':'Light'}</button></div></div><div class="summary">${t.summary(c)}</div>${items.slice(0,60).map(x=>`<div class="row"><span class="dot ${esc(x.color)}"></span><span class="name">${esc(x.name)}</span><span class="why">${esc(reason(x,lang))}</span></div>`).join('')}<div class="note">${t.note}</div>${items.length>60?`<div class="more">+${items.length-60} more items in the model-readable result.</div>`:''}`;document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;render()}));document.getElementById('themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';render()})}render()})();
</script></body></html>
