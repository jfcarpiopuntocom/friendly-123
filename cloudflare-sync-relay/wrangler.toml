# friendly123-sync-relay — relay del motor de sync. Worker SEPARADO del de
# licencias. NUNCA poner aqui "friendly123-licencias" ni su KV: mismo name =
# mismo Worker en Cloudflare y un deploy pisaria al otro (ya paso entre
# amigable y friendly, 2026-07-28).
name = "friendly123-sync-relay"
main = "worker.js"
compatibility_date = "2026-07-10"
preview_urls = false

# Public verification key only. The operator's private key is stored privately
# with Windows DPAPI; this permits signed, read-only encrypted history exports.
[vars]
RELAY_MIGRATION_PUBLIC_KEY = "cZrsa2pl5lrEQF03w_TI0RofZfRTEXBSmq6umA_Z3CI"
RELAY_ARCHIVE_ONLY = "1"

# Salas con hibernacion y sobres cifrados persistidos en SQLite.
[[durable_objects.bindings]]
name = "SALAS"
class_name = "SalaSync"

[[durable_objects.bindings]]
name = "SIGNALS"
class_name = "SignalRoom"

# new_sqlite_classes (no new_classes): el backend SQLite de Durable Objects es
# elegible en el plan GRATIS de Cloudflare, sujeto a sus limites de lecturas,
# escrituras y almacenamiento. Hibernar ahorra duracion, no filas escritas.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalaSync"]

[[migrations]]
tag = "v2-signal-only"
new_sqlite_classes = ["SignalRoom"]
